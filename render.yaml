services:
  - type: web
    name: equipment-inventory
    runtime: node
    plan: free
    # ติดตั้ง Python deps สำหรับ generate_label.py (ฉลาก PDF) ก่อน build
    # fallback --break-system-packages สำหรับ image ใหม่ที่บังคับ PEP 668
    buildCommand: |
      python -m pip install --no-cache-dir -r requirements.txt \
        || python -m pip install --no-cache-dir --break-system-packages -r requirements.txt \
        || pip3 install --no-cache-dir -r requirements.txt \
        || pip3 install --no-cache-dir --break-system-packages -r requirements.txt
      python -c "import reportlab, barcode, PIL; print('python deps OK')"
      npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORTAL_MODE
        value: "true"
      - key: PORTAL_USERNAME
        value: portal_user
      - key: PORTAL_HOME_URL
        sync: false
      - key: SPREADSHEET_ID
        sync: false
      - key: GOOGLE_CREDENTIALS_ACCOUNT
        sync: false
      - key: GOOGLE_OAUTH
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        sync: false
      - key: RATE_LIMIT_MAX
        sync: false
      - key: CACHE_TTL
        sync: false
      - key: BACKUP_CRON
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false