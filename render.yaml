services:
  - type: web
    name: equipment-inventory
    runtime: node
    plan: free
    # ชั้นหลัก: ติดตั้ง Python deps (generate_label.py — ฉลาก PDF) ลง ./python_modules
    # (path "ใน repo" → คงอยู่ถึง runtime เหมือน node_modules เพราะ Render native runtime
    #  ไม่คง system site-packages จาก build phase ให้ runtime)
    # fallback --break-system-packages สำหรับ image ที่บังคับ PEP 668
    # ครอบลูป pip ด้วยวงเล็บ + || exit 1 → ถ้า install ไม่ได้จริง build พังทันทีใน log
    buildCommand: |
      (python -m pip install --no-cache-dir --upgrade --target ./python_modules -r requirements.txt \
        || python -m pip install --no-cache-dir --upgrade --break-system-packages --target ./python_modules -r requirements.txt \
        || pip3 install --no-cache-dir --upgrade --target ./python_modules -r requirements.txt \
        || pip3 install --no-cache-dir --upgrade --break-system-packages --target ./python_modules -r requirements.txt) \
        || exit 1
      PYTHONPATH="$PWD/python_modules" python -c "import reportlab, barcode, PIL; print('python deps OK (repo target ./python_modules)')" || exit 1
      # ชั้นสำรองที่ 2: startCommand (npm start) เรียก scripts/ensure_python_deps.js
      # ซึ่ง self-heal ตอน boot ทุกครั้ง ถ้า ./python_modules หายหรือใช้ไม่ได้
      npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORTAL_MODE
        value: "true"
      - key: PORTAL_USERNAME
        value: portal_user
      - key: PORTAL_HOME_URL
        sync: false
      - key: SPREADSHEET_ID
        sync: false
      - key: GOOGLE_CREDENTIALS_ACCOUNT
        sync: false
      - key: GOOGLE_OAUTH
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        sync: false
      - key: RATE_LIMIT_MAX
        sync: false
      - key: CACHE_TTL
        sync: false
      - key: BACKUP_CRON
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false