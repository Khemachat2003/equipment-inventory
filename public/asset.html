<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset Information</title>
<style>
:root{
  --navy:#0f172a;--blue:#2563eb;--blue-l:#eff6ff;--blue-b:#bfdbfe;
  --teal:#0d9488;--green:#16a34a;--green-bg:#f0fdf4;--green-b:#bbf7d0;
  --amber:#d97706;--amber-bg:#fffbeb;--red:#dc2626;--red-bg:#fef2f2;--red-b:#fecaca;
  --g100:#f1f5f9;--g200:#e2e8f0;--g400:#94a3b8;--g600:#475569;--g700:#334155;
  --sh:0 4px 20px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:#f1f5f9;min-height:100vh}

/* ── HEADER ── */
.hdr{background:var(--navy);padding:0 20px;height:56px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.3);position:sticky;top:0;z-index:10}
.hdr-logo{width:32px;height:32px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.hdr-text{color:#fff;font-size:14px;font-weight:700}
.hdr-sub{color:rgba(255,255,255,.4);font-size:11px;margin-top:1px}
.hdr-badge{margin-left:auto;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;flex-shrink:0}
.hdr-public{background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.15)}

/* ── LOADING ── */
.loading-wrap{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.spinner{width:40px;height:40px;border:4px solid var(--blue-b);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:var(--g400)}

/* ── PAGE ── */
.page{max-width:700px;margin:0 auto;padding:24px 16px 60px}

/* ── STATUS BANNER ── */
.status-banner{
  border-radius:14px;padding:18px 20px;margin-bottom:20px;
  display:flex;align-items:center;gap:14px;
  border:1.5px solid;
}
.sb-ok{background:var(--green-bg);border-color:var(--green-b)}
.sb-rep{background:var(--red-bg);border-color:var(--red-b)}
.sb-spare{background:var(--amber-bg);border-color:#fde68a}
.sb-icon{font-size:28px;flex-shrink:0}
.sb-title{font-size:15px;font-weight:700}
.sb-sub{font-size:13px;opacity:.7;margin-top:2px}

/* ── ASSET CARD ── */
.card{background:#fff;border-radius:16px;border:1px solid var(--g200);box-shadow:var(--sh);overflow:hidden;margin-bottom:16px}
.card-head{
  background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 100%);
  padding:22px 24px;
}
.card-head-serial{
  display:inline-block;
  font-family:monospace;font-size:11px;font-weight:600;
  background:rgba(255,255,255,.12);color:rgba(255,255,255,.7);
  padding:3px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.15);
  margin-bottom:8px;letter-spacing:.5px;
}
.card-head-name{color:#fff;font-size:20px;font-weight:800;line-height:1.3}

/* ── QR + INFO ── */
.card-body{padding:20px 24px}
.ci-wrap{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.qr-box{
  flex-shrink:0;width:150px;height:150px;
  border:1px solid var(--g200);border-radius:12px;
  background:var(--g100);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.qr-box img{width:100%;height:100%;object-fit:contain}

/* ── INFO TABLE ── */
.info-tbl{flex:1;min-width:180px}
.info-row{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--g100);gap:10px;font-size:13px}
.info-row:last-child{border-bottom:none}
.info-lbl{color:var(--g400);font-weight:500;flex-shrink:0;min-width:100px}
.info-val{color:var(--navy);font-weight:600;text-align:right;word-break:break-word}

/* ── SECTION HEAD ── */
.section-head{
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;color:var(--g600);
  text-transform:uppercase;letter-spacing:.6px;
  padding:14px 0 8px;border-top:1px solid var(--g200);
  margin-top:4px;
}

/* ── FACTORY INFO BOX ── */
.factory-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:4px}
.factory-chip{
  background:var(--g100);border:1px solid var(--g200);
  border-radius:10px;padding:12px;
}
.fc-lbl{font-size:10px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.fc-val{font-size:14px;font-weight:700;color:var(--navy)}

/* ── TIMELINE ── */
.timeline{padding-left:32px;position:relative;margin-top:8px}
.timeline::before{content:"";position:absolute;left:10px;top:16px;bottom:16px;width:2px;background:linear-gradient(to bottom,var(--blue),var(--blue-b));border-radius:2px}
.tl-item{position:relative;margin-bottom:12px}
.tl-dot{position:absolute;left:-32px;top:12px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;box-shadow:0 0 0 3px #fff}
.tl-cur{background:var(--blue);border:2px solid #93c5fd;color:#fff;box-shadow:0 0 0 3px #dbeafe}
.tl-move{background:var(--blue-l);border:2px solid var(--blue);color:var(--blue)}
.tl-reg{background:var(--green-bg);border:2px solid #4ade80;color:var(--green)}
.tl-rep{background:var(--red-bg);border:2px solid #f87171;color:var(--red)}
.tl-box{background:#fff;border:1px solid var(--g200);border-radius:10px;padding:10px 14px}
.tl-box-cur{border-color:var(--blue-b);background:var(--blue-l)}
.tl-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:5px}
.tl-action{font-size:13px;font-weight:700;color:var(--navy)}
.tl-now{display:inline-block;margin-left:6px;background:var(--blue);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;vertical-align:middle}
.tl-date{font-size:11px;color:var(--g400);white-space:nowrap;background:var(--g100);padding:2px 8px;border-radius:20px}
.tl-route{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11px}
.tl-chip{background:var(--g100);border:1px solid var(--g200);color:var(--g600);padding:2px 8px;border-radius:5px}
.tl-chip-d{background:var(--blue-l);border-color:var(--blue-b);color:var(--blue)}
.tl-arr{color:var(--g400)}
.tl-user{font-size:11px;color:var(--g400);margin-top:5px}

/* ── FOOTER ── */
.footer{text-align:center;padding:20px;color:var(--g400);font-size:12px}
.footer-brand{font-weight:700;color:var(--g600)}

/* ── ERROR ── */
.error-wrap{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px}
.error-icon{font-size:48px}
.error-title{font-size:17px;font-weight:700;color:var(--navy)}
.error-sub{font-size:14px;color:var(--g400);line-height:1.6;max-width:320px}

/* ── PRINT ── */
@media print{.hdr .hdr-badge,.footer{display:none}}

/* ── RESPONSIVE ── */
@media(max-width:500px){.ci-wrap{flex-direction:column}.qr-box{width:100%;aspect-ratio:1;height:auto}}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">📦</div>
  <div>
    <div class="hdr-text">Equipment Management</div>
    <div class="hdr-sub">Asset Information System</div>
  </div>
  <div class="hdr-badge hdr-public">PUBLIC VIEW</div>
</header>

<div id="root">
  <div class="loading-wrap">
    <div class="spinner"></div>
    <div class="loading-text">กำลังโหลดข้อมูลอุปกรณ์...</div>
  </div>
</div>

<script>
/* ── สกัด Serial จาก URL ── */
function getSerial(){
  const q=new URLSearchParams(window.location.search).get("serial");
  if(q)return decodeURIComponent(q);
  const p=window.location.pathname.split("/").filter(Boolean);
  const last=p[p.length-1];
  if(last&&!last.endsWith(".html"))return decodeURIComponent(last);
  return "";
}

const serial=getSerial();

/* ── STATUS CONFIG ── */
function statusConfig(s=""){
  const t=s.toLowerCase();
  if(t.includes("ซ่อม"))return{cls:"sb-rep",icon:"🔧",title:"อยู่ระหว่างซ่อม",sub:"อุปกรณ์นี้ถูกส่งซ่อม ยังไม่พร้อมใช้งาน"};
  if(t.includes("สำรอง"))return{cls:"sb-spare",icon:"📦",title:"สำรอง",sub:"อุปกรณ์นี้อยู่ในคลังสำรอง พร้อมเบิกใช้"};
  if(t.includes("ชำรุด")||t.includes("สูญ"))return{cls:"sb-rep",icon:"❌",title:"ชำรุด / สูญหาย",sub:"อุปกรณ์นี้ไม่พร้อมใช้งาน"};
  return{cls:"sb-ok",icon:"✅",title:"พร้อมใช้งาน",sub:"อุปกรณ์นี้ใช้งานได้ตามปกติ"};
}

function dotClass(a=""){
  const t=a.toLowerCase();
  if(t.includes("ลงทะเบียน")||t.includes("เพิ่ม"))return{cls:"tl-reg",icon:"✦"};
  if(t.includes("ซ่อม"))return{cls:"tl-rep",icon:"🔧"};
  return{cls:"tl-move",icon:"→"};
}

async function loadAll(){
  if(!serial){
    document.getElementById("root").innerHTML=`
      <div class="error-wrap">
        <div class="error-icon">⚠️</div>
        <div class="error-title">ไม่พบรหัสอุปกรณ์</div>
        <div class="error-sub">URL ไม่ถูกต้อง กรุณาสแกน QR Code ใหม่อีกครั้ง</div>
      </div>`;
    return;
  }

  try{
    /* โหลดข้อมูลอุปกรณ์และประวัติพร้อมกัน */
    const [assetRes, histRes] = await Promise.all([
      fetch(`/api/public/asset/${encodeURIComponent(serial)}`),
      fetch(`/api/public-asset-history/${encodeURIComponent(serial)}`)
    ]);

    if(!assetRes.ok) throw new Error("not found");
    const d = await assetRes.json();
    const history = histRes.ok ? await histRes.json() : [];

    const sc = statusConfig(d.status||"");

    /* ── QR Box ── */
    const qrHtml = d.qr
      ? `<img src="${d.qr}" alt="QR Code">`
      : `<span style="font-size:12px;color:var(--g400)">ไม่มี QR</span>`;

    /* ── Factory info (ถ้ามี) ── */
    const hasFactory = d.farmType && d.farmType !== "-";
    const factoryHtml = hasFactory ? `
      <div class="section-head">🏭 ข้อมูลการติดตั้ง</div>
      <div class="factory-grid">
        ${d.farmType&&d.farmType!=="-"?`<div class="factory-chip"><div class="fc-lbl">ประเภทฟาร์ม</div><div class="fc-val">${d.farmType}</div></div>`:""}
        ${d.siteName&&d.siteName!=="-"?`<div class="factory-chip"><div class="fc-lbl">ไซต์งาน</div><div class="fc-val">${d.siteName}</div></div>`:""}
        ${d.houseName&&d.houseName!=="-"?`<div class="factory-chip"><div class="fc-lbl">โรงเรือน</div><div class="fc-val">${d.houseName}</div></div>`:""}
        ${d.location&&d.location!=="-"?`<div class="factory-chip"><div class="fc-lbl">ตำแหน่ง</div><div class="fc-val">${d.location}</div></div>`:""}
      </div>` : "";

    /* ── Timeline ── */
    let timelineHtml = "";
    if(history.length){
      timelineHtml = `
        <div class="section-head">📋 ประวัติการเคลื่อนย้าย (${history.length} รายการ)</div>
        <div class="timeline">
          ${history.slice(0,6).map((h,i)=>{
            const isFirst=i===0;
            const {cls,icon}=isFirst?{cls:"tl-cur",icon:"📍"}:dotClass(h.action);
            const routeHtml=(h.from&&h.from!=="-")
              ?`<div class="tl-route"><span class="tl-chip">${h.from}</span><span class="tl-arr">→</span><span class="tl-chip tl-chip-d">${h.to||"-"}</span></div>`
              :(h.to&&h.to!=="-")?`<div class="tl-route"><span class="tl-chip tl-chip-d">📍 ${h.to}</span></div>`:"";
            return`<div class="tl-item">
              <div class="tl-dot ${cls}">${icon}</div>
              <div class="tl-box ${isFirst?"tl-box-cur":""}">
                <div class="tl-top">
                  <div class="tl-action">${h.action||"-"}${isFirst?'<span class="tl-now">ปัจจุบัน</span>':""}</div>
                  <div class="tl-date">📅 ${h.date||"-"}</div>
                </div>
                ${routeHtml}
                <div class="tl-user">👤 ${h.user||"System"}${h.remark&&h.remark!=="-"?` · 💬 ${h.remark}`:""}</div>
              </div>
            </div>`}).join("")}
        </div>`;
    }

    document.getElementById("root").innerHTML = `
    <div class="page">

      <!-- STATUS BANNER -->
      <div class="status-banner ${sc.cls}">
        <div class="sb-icon">${sc.icon}</div>
        <div>
          <div class="sb-title">${sc.title}</div>
          <div class="sb-sub">${sc.sub}</div>
        </div>
      </div>

      <!-- ASSET CARD -->
      <div class="card">
        <div class="card-head">
          <div class="card-head-serial">S/N : ${d.serialNumber||serial}</div>
          <div class="card-head-name">${d.name||"อุปกรณ์"}</div>
        </div>
        <div class="card-body">
          <div class="ci-wrap">
            <div class="qr-box">${qrHtml}</div>
            <div class="info-tbl">
              <div class="info-row"><span class="info-lbl">Asset ID</span><span class="info-val">${d.assetId||"-"}</span></div>
              <div class="info-row"><span class="info-lbl">Part Number</span><span class="info-val">${d.partNumber||"-"}</span></div>
              <div class="info-row"><span class="info-lbl">Code</span><span class="info-val">${d.code||"-"}</span></div>
              <div class="info-row"><span class="info-lbl">สถานะ</span><span class="info-val">${d.status||"-"}</span></div>
              <div class="info-row"><span class="info-lbl">ผู้รับผิดชอบ</span><span class="info-val">${d.user||"-"}</span></div>
              <div class="info-row"><span class="info-lbl">อัปเดตล่าสุด</span><span class="info-val">${d.date||"-"}</span></div>
            </div>
          </div>

          ${factoryHtml}
          ${timelineHtml}

        </div>
      </div>

    </div>

    <div class="footer">
      สแกนโดย <span class="footer-brand">Equipment Management System</span><br>
      ข้อมูล ณ วันที่ ${new Date().toLocaleDateString("th-TH",{year:"numeric",month:"long",day:"numeric"})}
    </div>`;

  }catch(e){
    document.getElementById("root").innerHTML=`
      <div class="error-wrap">
        <div class="error-icon">📭</div>
        <div class="error-title">ไม่พบข้อมูลอุปกรณ์</div>
        <div class="error-sub">Serial Number: <strong>${serial}</strong><br>ไม่พบในระบบ หรืออาจยังไม่ได้ลงทะเบียน</div>
      </div>`;
  }
}

loadAll();
</script>
</body>
</html>
