<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset Information</title>
<style>
/* ป้องกันการแคปหน้าจอ */
* {
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}
@media print {
  body { display: none !important; }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:#f1f5f9;min-height:100vh}

/* Header */
.hdr{background:#0f172a;padding:12px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.hdr-logo{width:32px;height:32px;background:#2563eb;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.hdr-text{color:#fff;font-size:14px;font-weight:700}
.hdr-sub{color:rgba(255,255,255,.4);font-size:11px}
.hdr-badge{margin-left:auto;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700}
.hdr-public{background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.15)}
.hdr-admin{background:#2563eb;color:#fff;border:1px solid #60a5fa}

/* Page */
.page{max-width:700px;margin:16px auto;padding:0 16px 60px}

/* Status Banner (public) */
.status-banner{
  border-radius:14px;padding:18px 20px;margin-bottom:20px;
  display:flex;align-items:center;gap:14px;border:1.5px solid;
}
.sb-ok{background:#f0fdf4;border-color:#bbf7d0}
.sb-rep{background:#fef2f2;border-color:#fecaca}
.sb-spare{background:#fffbeb;border-color:#fde68a}
.sb-icon{font-size:28px}
.sb-title{font-size:15px;font-weight:700}
.sb-sub{font-size:13px;opacity:.7;margin-top:2px}

/* Full Card (admin) */
.card{background:#fff;border-radius:16px;border:1px solid #e5e7eb;box-shadow:0 4px 16px rgba(0,0,0,.08);overflow:hidden;margin-bottom:16px}
.card-head{background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 100%);padding:22px 24px}
.card-head-serial{display:inline-block;font-family:monospace;font-size:11px;font-weight:600;background:rgba(255,255,255,.12);color:rgba(255,255,255,.7);padding:3px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.15);margin-bottom:8px;letter-spacing:.5px}
.card-head-name{color:#fff;font-size:20px;font-weight:800;line-height:1.3}
.card-body{padding:20px 24px}
.ci-wrap{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.qr-box{flex-shrink:0;width:150px;height:150px;border:1px solid #e5e7eb;border-radius:12px;background:#f9fafb;overflow:hidden;display:flex;align-items:center;justify-content:center}
.qr-box img{width:100%;height:100%;object-fit:contain}
.info-tbl{flex:1;min-width:180px}
.info-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f1f5f9;gap:10px;font-size:13px}
.info-row:last-child{border-bottom:none}
.info-lbl{color:#94a3b8;font-weight:500}
.info-val{color:#0f172a;font-weight:600;text-align:right}

.factory-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:8px}
.factory-chip{background:#f1f5f9;border:1px solid #e5e7eb;border-radius:10px;padding:12px}
.fc-lbl{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px}
.fc-val{font-size:14px;font-weight:700;color:#0f172a;margin-top:3px}

/* Timeline */
.timeline{padding-left:32px;position:relative;margin-top:8px}
.timeline::before{content:"";position:absolute;left:10px;top:16px;bottom:16px;width:2px;background:linear-gradient(to bottom,#2563eb,#bfdbfe);border-radius:2px}
.tl-item{position:relative;margin-bottom:12px}
.tl-dot{position:absolute;left:-32px;top:12px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;box-shadow:0 0 0 3px #fff}
.tl-cur{background:#2563eb;border:2px solid #93c5fd;color:#fff;box-shadow:0 0 0 3px #dbeafe}
.tl-move{background:#eff6ff;border:2px solid #2563eb;color:#2563eb}
.tl-reg{background:#f0fdf4;border:2px solid #4ade80;color:#166534}
.tl-rep{background:#fef2f2;border:2px solid #f87171;color:#dc2626}
.tl-box{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 14px}
.tl-box-cur{border-color:#bfdbfe;background:#eff6ff}
.tl-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tl-action{font-size:13px;font-weight:700;color:#0f172a}
.tl-now{display:inline-block;margin-left:6px;background:#2563eb;color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;vertical-align:middle}
.tl-date{font-size:11px;color:#94a3b8;white-space:nowrap;background:#f1f5f9;padding:2px 8px;border-radius:20px}
.tl-route{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11px;margin:5px 0}
.tl-chip{background:#f1f5f9;border:1px solid #e5e7eb;color:#475569;padding:2px 8px;border-radius:5px}
.tl-chip-d{background:#eff6ff;border-color:#bfdbfe;color:#2563eb}
.tl-arr{color:#94a3b8}
.tl-user{font-size:11px;color:#94a3b8;margin-top:5px}

/* Buttons */
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.btn{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid transparent;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:.15s}
.btn-blue{background:#2563eb;color:#fff;border-color:#2563eb}
.btn-blue:hover{background:#1d4ed8}
.btn-outline{background:#fff;color:#0f172a;border-color:#e5e7eb}
.btn-outline:hover{background:#f1f5f9}
.btn-teal{background:#0d9488;color:#fff;border-color:#0d9488}
.btn-teal:hover{background:#0f766e}

/* Loading */
.loading{text-align:center;padding:40px;color:#94a3b8}
.spinner{width:32px;height:32px;border:3px solid #bfdbfe;border-top-color:#2563eb;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Error */
.error{text-align:center;padding:40px}
.error .icon{font-size:40px;margin-bottom:8px}
.error-title{font-weight:700;color:#0f172a;font-size:17px}
.error-sub{font-size:14px;color:#94a3b8}

/* ═══════════════════════════════════════════════════════════════
   ICON DESIGN SYSTEM — Premium Material Symbols
   Size × Weight × Fill × Grade × Color × State
═══════════════════════════════════════════════════════════════ */

/* Base icon element */
.material-symbols-rounded {
  font-family: 'Material Symbols Rounded';
  font-style: normal;
  font-variation-settings:
    'wght' var(--icon-w-regular, 400),
    'FILL' var(--icon-fill-none, 0),
    'GRAD' var(--icon-grade-normal, 0),
    'opsz' var(--icon-opsz-md, 24);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  line-height: 1;
  vertical-align: middle;
  transition:
    font-variation-settings var(--icon-transition),
    color var(--icon-transition),
    transform var(--icon-transition);
}

/* ─── Size Modifiers ─── */
.icon-xs { font-size: var(--icon-xs); --icon-opsz-md: var(--icon-opsz-sm); }
.icon-sm { font-size: var(--icon-sm); --icon-opsz-md: var(--icon-opsz-sm); }
.icon-md { font-size: var(--icon-md); --icon-opsz-md: var(--icon-opsz-md); }
.icon-lg { font-size: var(--icon-lg); --icon-opsz-md: var(--icon-opsz-lg); }
.icon-xl { font-size: var(--icon-xl); --icon-opsz-md: var(--icon-opsz-lg); }
.icon-2xl { font-size: var(--icon-2xl); --icon-opsz-md: var(--icon-opsz-xl); }

/* ─── Weight Modifiers ─── */
.icon-light     { --icon-w-regular: var(--icon-w-light); }
.icon-regular   { --icon-w-regular: var(--icon-w-regular); }
.icon-medium    { --icon-w-regular: var(--icon-w-medium); }
.icon-semibold  { --icon-w-regular: var(--icon-w-semibold); }
.icon-bold      { --icon-w-regular: var(--icon-w-bold); }

/* ─── Fill Modifiers (semantic) ─── */
.icon-outline   { --icon-fill-none: var(--icon-fill-none); }
.icon-hover     { --icon-fill-none: var(--icon-fill-subtle); }
.icon-active    { --icon-fill-none: var(--icon-fill-half); }
.icon-filled    { --icon-fill-none: var(--icon-fill-full); }

/* ─── Grade Modifiers ─── */
.icon-grade-normal { --icon-grade-normal: var(--icon-grade-normal); }
.icon-grade-dark   { --icon-grade-normal: var(--icon-grade-dark); }
.icon-grade-light  { --icon-grade-normal: var(--icon-grade-light); }

/* ─── Semantic Color Variants ─── */
.icon-primary   { color: var(--blue); }
.icon-secondary { color: var(--tsub); }
.icon-muted     { color: var(--tmuted); }
.icon-success   { color: var(--emerald); }
.icon-warning   { color: var(--amber); }
.icon-danger    { color: var(--red); }
.icon-purple    { color: var(--purple); }
.icon-white     { color: #fff; }
.icon-inherit   { color: inherit; }

/* ─── Composite Utility Classes ─── */
.nav-icon {
  --icon-w-regular: var(--icon-w-medium);
  --icon-fill-none: var(--icon-fill-none);
  --icon-grade-normal: var(--icon-grade-normal);
  --icon-opsz-md: var(--icon-opsz-md);
  font-size: var(--icon-md);
  color: var(--tsub);
  transition: color var(--icon-transition), font-variation-settings var(--icon-transition);
}
.nav-icon:hover,
.nav-icon.active {
  color: var(--blue);
  --icon-fill-none: var(--icon-fill-full);
  --icon-w-regular: var(--icon-w-semibold);
}

.btn-icon {
  --icon-w-regular: var(--icon-w-semibold);
  --icon-fill-none: var(--icon-fill-none);
  font-size: var(--icon-sm);
}
.btn-primary .btn-icon    { color: var(--blue); }
.btn-primary:hover .btn-icon    { --icon-fill-none: var(--icon-fill-subtle); }
.btn-primary:active .btn-icon   { --icon-fill-none: var(--icon-fill-half); }
.btn-secondary .btn-icon  { color: var(--tsub); }
.btn-outline .btn-icon    { color: var(--blue); }
.btn-ghost .btn-icon      { color: var(--tsub); }
.btn-ghost:hover .btn-icon    { color: var(--blue); --icon-fill-none: var(--icon-fill-subtle); }

.status-icon {
  --icon-w-regular: var(--icon-w-semibold);
  --icon-fill-none: var(--icon-fill-full);
  font-size: var(--icon-xs);
}
.status-success .status-icon { color: var(--emerald); }
.status-warning .status-icon { color: var(--amber); }
.status-danger .status-icon  { color: var(--red); }
.status-info .status-icon    { color: var(--blue); }

.card-icon {
  --icon-w-regular: var(--icon-w-regular);
  --icon-fill-none: var(--icon-fill-none);
  font-size: var(--icon-xl);
  color: var(--blue);
}
.card:hover .card-icon {
  --icon-fill-none: var(--icon-fill-subtle);
  --icon-w-regular: var(--icon-w-medium);
}

.fab-icon {
  --icon-w-regular: var(--icon-w-bold);
  --icon-fill-none: var(--icon-fill-full);
  font-size: var(--icon-lg);
  color: #fff;
}

.table-action-icon {
  --icon-w-regular: var(--icon-w-medium);
  --icon-fill-none: var(--icon-fill-none);
  font-size: var(--icon-sm);
  color: var(--tmuted);
  transition: color var(--icon-transition), font-variation-settings var(--icon-transition), transform var(--icon-transition);
}
.table-action-icon:hover {
  color: var(--blue);
  --icon-fill-none: var(--icon-fill-subtle);
  transform: scale(1.1);
}

.empty-icon {
  --icon-w-regular: var(--icon-w-light);
  --icon-fill-none: var(--icon-fill-none);
  font-size: var(--icon-2xl);
  color: var(--g300);
}

.header-icon {
  --icon-w-regular: var(--icon-w-semibold);
  --icon-fill-none: var(--icon-fill-full);
  font-size: var(--icon-lg);
  color: var(--ink);
}

.material-symbols-rounded:not(.no-transition) {
  transition: font-variation-settings 150ms ease, color 150ms ease, transform 150ms ease;
}

.material-symbols-rounded:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
  border-radius: 4px;
}

@media (prefers-reduced-motion: reduce) {
  .material-symbols-rounded {
    transition: none;
  }
}


/* ── Global: ลบเส้นใต้ anchor ทุกแบบ (รวม icon-button ที่ JS สร้างขึ้น) ── */
a,
a:link,
a:visited { text-decoration: none; }
a:hover,
a:focus { text-decoration: none; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-25..200" crossorigin="anonymous" />
</head>
<body>

<header class="hdr">
  <div class="hdr-logo"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">inventory_2</span></div>
  <div>
    <div class="hdr-text">Equipment Management</div>
    <div class="hdr-sub">Asset Information</div>
  </div>
  <div id="headerBadge" class="hdr-badge hdr-public">PUBLIC VIEW</div>
</header>

<div id="root">
  <div class="loading"><div class="spinner"></div><p>กำลังโหลด...</p></div>
</div>

<script>
function getSerial(){
  const q=new URLSearchParams(window.location.search).get("serial");
  if(q) return decodeURIComponent(q);
  const p=window.location.pathname.split("/").filter(Boolean);
  const last=p[p.length-1];
  if(last && !last.endsWith(".html")) return decodeURIComponent(last);
  return "";
}

// <span class="material-symbols-rounded icon-sm icon-regular icon-filled icon-success">check_circle</span> ฟังก์ชันตรวจสอบแหล่งที่มาของการสแกน
function getSource() {
  const q = new URLSearchParams(window.location.search);
  return q.get("from") || "external"; // ถ้าไม่มี from=internal → external
}

function getStatusBadgeClass(s=""){
  const t=s.toLowerCase();
  if(t.includes("ซ่อม")) return "sb-rep";
  if(t.includes("สำรอง")) return "sb-spare";
  return "sb-ok";
}
function getStatusIcon(s=""){
  const t=s.toLowerCase();
  if(t.includes("ซ่อม")) return "<span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">build</span>";
  if(t.includes("สำรอง")) return "<span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">inventory_2</span>";
  return "<span class="material-symbols-rounded icon-sm icon-regular icon-filled icon-success">check_circle</span>";
}

const serial=getSerial();
let isAdmin=false;
let currentUser="";

// ตรวจสอบสถานะ login
async function checkAuth(){
  try{
    const r=await fetch("/api/check-auth",{credentials:"include"});
    const d=await r.json();
    if(d.loggedIn){
      isAdmin=true;
      currentUser=d.username||"Admin";
      document.getElementById("headerBadge").className="hdr-badge hdr-admin";
      document.getElementById("headerBadge").textContent=`<span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">person</span> ${currentUser}`;
    }
  }catch(e){}
}

// โหลดข้อมูลหลัก
async function loadAsset(){
  if(!serial){
    document.getElementById("root").innerHTML=`
      <div class="error"><div class="icon">⚠</div><div class="error-title">ไม่พบรหัสอุปกรณ์</div>
      <div class="error-sub">กรุณาสแกน QR Code ใหม่อีกครั้ง</div></div>`;
    return;
  }

  try{
    // ดึงข้อมูล asset (public endpoint)
    const res=await fetch(`/api/public/asset/${encodeURIComponent(serial)}`);
    if(!res.ok) throw new Error("not found");
    const d=await res.json();

    // ดึงประวัติ (ใช้ public endpoint)
    const histRes=await fetch(`/api/public-asset-history/${encodeURIComponent(serial)}`);
    const history=histRes.ok ? await histRes.json() : [];

    const statusClass=getStatusBadgeClass(d.status);
    const icon=getStatusIcon(d.status);
    const name=d.name||"อุปกรณ์";
    const statusText=d.status||"ไม่ระบุ";

    // <span class="material-symbols-rounded icon-sm icon-regular icon-filled icon-success">check_circle</span> ตรวจสอบแหล่งที่มาของการสแกน
    const source = getSource();

    // --- ถ้าเป็น admin และมาจาก internal scan (สแกนผ่านเว็บของเรา) เท่านั้น ---
    if(isAdmin && source === "internal"){
      // สร้าง QR HTML
      const qrHtml=d.qr ? `<img src="${d.qr}" alt="QR">` : `<span style="color:#94a3b8">ไม่มี QR</span>`;

      // ข้อมูลฟาร์ม
      let factoryHtml="";
      if(d.farmType && d.farmType!=="-"){
        factoryHtml=`
          <div style="margin-top:12px;border-top:1px solid #f1f5f9;padding-top:12px">
            <div style="font-weight:700;color:#475569;font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">factory</span> ข้อมูลการติดตั้ง</div>
            <div class="factory-grid">
              ${d.farmType!=="-" ? `<div class="factory-chip"><div class="fc-lbl">ประเภทฟาร์ม</div><div class="fc-val">${d.farmType}</div></div>`:""}
              ${d.siteName!=="-" ? `<div class="factory-chip"><div class="fc-lbl">ไซต์งาน</div><div class="fc-val">${d.siteName}</div></div>`:""}
              ${d.houseName!=="-" ? `<div class="factory-chip"><div class="fc-lbl">โรงเรือน</div><div class="fc-val">${d.houseName}</div></div>`:""}
              ${d.location!=="-" ? `<div class="factory-chip"><div class="fc-lbl">ตำแหน่ง</div><div class="fc-val">${d.location}</div></div>`:""}
            </div>
          </div>`;
      }

      // ประวัติ (เฉพาะ 6 รายการ)
      let timelineHtml="";
      if(history.length){
        timelineHtml=`
          <div style="margin-top:16px;border-top:1px solid #f1f5f9;padding-top:16px">
            <div style="font-weight:700;color:#475569;font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">assignment</span> ประวัติการเคลื่อนย้าย (${history.length} รายการ)</div>
            <div class="timeline">`;
        history.slice(0,6).forEach((h,i)=>{
          const isFirst=i===0;
          const dotClass=isFirst?"tl-cur":(h.action.includes("ซ่อม")?"tl-rep":h.action.includes("ลงทะเบียน")?"tl-reg":"tl-move");
          const dotIcon=isFirst?"<span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">place</span>":(h.action.includes("ซ่อม")?"<span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">build</span>":h.action.includes("ลงทะเบียน")?"✦":"→");
          const routeHtml=(h.from&&h.from!=="-")
            ?`<div class="tl-route"><span class="tl-chip">${h.from}</span><span class="tl-arr">→</span><span class="tl-chip tl-chip-d">${h.to||"-"}</span></div>`
            :(h.to&&h.to!=="-")?`<div class="tl-route"><span class="tl-chip tl-chip-d"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">place</span> ${h.to}</span></div>`:"";
          timelineHtml+=`<div class="tl-item">
            <div class="tl-dot ${dotClass}">${dotIcon}</div>
            <div class="tl-box ${isFirst?"tl-box-cur":""}">
              <div class="tl-top"><div class="tl-action">${h.action||"-"}${isFirst?'<span class="tl-now">ล่าสุด</span>':""}</div><div class="tl-date"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">event</span> ${h.date||"-"}</div></div>
              ${routeHtml}
              <div class="tl-user"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">person</span> ${h.user||"System"}${h.remark&&h.remark!=="-"?` · <span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">chat</span> ${h.remark}`:""}</div>
            </div>
          </div>`;
        });
        timelineHtml+=`</div></div>`;
      }

      // <span class="material-symbols-rounded icon-sm icon-regular icon-filled icon-success">check_circle</span> ปุ่มจัดการ (แก้ไขลิงก์ประวัติให้มี ?from=internal)
      const actionsHtml=`
        <div class="actions">
          <button class="btn btn-blue" onclick="window.location.href='/trace.html?serial=${encodeURIComponent(serial)}&from=internal'"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">assignment</span> ประวัติเต็ม</button>
          <button class="btn btn-teal" onclick="window.location.href='/qr.html?serial=${encodeURIComponent(serial)}'"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">print</span> พิมพ์ QR</button>
          <button class="btn btn-outline" onclick="window.print()"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">print</span> พิมพ์หน้านี้</button>
        </div>`;

      // การ์ดเต็ม
      document.getElementById("root").innerHTML=`
        <div style="margin-bottom:12px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px 16px;font-size:13px;color:#1e40af">
          <span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">lock</span> โหมดผู้ดูแลระบบ — คุณสามารถโอนย้ายและดูประวัติได้
        </div>
        ${actionsHtml}
        <div class="card">
          <div class="card-head">
            <div class="card-head-serial">S/N : ${d.serialNumber||serial}</div>
            <div class="card-head-name">${name}</div>
          </div>
          <div class="card-body">
            <div class="ci-wrap">
              <div class="qr-box">${qrHtml}</div>
              <div class="info-tbl">
                <div class="info-row"><span class="info-lbl">Asset ID</span><span class="info-val">${d.assetId||"-"}</span></div>
                <div class="info-row"><span class="info-lbl">Part Number</span><span class="info-val">${d.partNumber||"-"}</span></div>
                <div class="info-row"><span class="info-lbl">Code</span><span class="info-val">${d.code||"-"}</span></div>
                <div class="info-row"><span class="info-lbl">สถานะ</span><span class="info-val">${d.status||"-"}</span></div>
                <div class="info-row"><span class="info-lbl">ผู้รับผิดชอบ</span><span class="info-val">${d.user||"-"}</span></div>
                <div class="info-row"><span class="info-lbl">อัปเดตล่าสุด</span><span class="info-val">${d.date||"-"}</span></div>
              </div>
            </div>
            ${factoryHtml}
            ${timelineHtml}
          </div>
        </div>
        <div style="text-align:center;font-size:12px;color:#94a3b8;padding:12px">ข้อมูล ณ ${new Date().toLocaleDateString("th-TH",{year:"numeric",month:"long",day:"numeric"})}</div>
      `;
    } else {
      // --- โหมดสาธารณะ (ไม่ login หรือสแกนจากภายนอก) แสดงเฉพาะสถานะปัจจุบัน ---
      const badge=getStatusBadgeClass(d.status);
      const icon2=getStatusIcon(d.status);
      document.getElementById("root").innerHTML=`
        <div style="background:#fff;border-radius:16px;border:1px solid #e5e7eb;box-shadow:0 4px 16px rgba(0,0,0,.08);overflow:hidden">
          <div style="padding:20px 24px;display:flex;align-items:center;gap:16px">
            <div style="font-size:40px">${icon2}</div>
            <div>
              <h2 style="font-size:18px;font-weight:800;color:#0f172a">${name}</h2>
              <p style="font-size:13px;color:#6b7280">S/N: ${d.serialNumber||serial}</p>
              <span class="status-banner ${badge}" style="display:inline-block;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;margin-top:4px">${d.status||"ไม่ระบุ"}</span>
            </div>
          </div>
          <div style="border-top:1px solid #f1f5f9;padding:16px 24px 20px">
            <div class="info-row"><span class="info-lbl"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">place</span> ตำแหน่ง</span><span class="info-val">${d.siteName||"-"} ${d.location?`(${d.location})`:""}</span></div>
            ${d.houseName && d.houseName!=="-" ? `<div class="info-row"><span class="info-lbl"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">home</span> โรงเรือน</span><span class="info-val">${d.houseName}</span></div>`:""}
            ${d.farmType && d.farmType!=="-" ? `<div class="info-row"><span class="info-lbl"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">factory</span> ประเภทฟาร์ม</span><span class="info-val">${d.farmType}</span></div>`:""}
            <div class="info-row"><span class="info-lbl"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">person</span> ผู้รับผิดชอบ</span><span class="info-val">${d.user||"-"}</span></div>
            <div class="info-row"><span class="info-lbl"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">event</span> อัปเดตล่าสุด</span><span class="info-val">${d.date||"-"}</span></div>
          </div>
          <div style="text-align:center;padding:14px;font-size:11px;color:#94a3b8;border-top:1px solid #f1f5f9"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">lock</span> ข้อมูล ณ ปัจจุบัน · ${new Date().toLocaleDateString("th-TH")}</div>
        </div>`;
    }

  }catch(e){
    document.getElementById("root").innerHTML=`
      <div class="error"><div class="icon"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">mail</span></div><div class="error-title">ไม่พบข้อมูล</div>
      <div class="error-sub">Serial <strong>${serial}</strong> ไม่มีในระบบ</div></div>`;
  }
}
