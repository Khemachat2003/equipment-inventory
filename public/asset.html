<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset Information</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --blue:#1e3a8a;
  --blue-mid:#2563eb;
  --blue-light:#eff6ff;
  --blue-border:#bfdbfe;
  --green:#166534;
  --green-bg:#f0fdf4;
  --green-border:#bbf7d0;
  --amber:#92400e;
  --amber-bg:#fffbeb;
  --red:#991b1b;
  --red-bg:#fef2f2;
  --red-border:#fecaca;
  --gray-border:#e5e7eb;
  --gray-light:#f9fafb;
  --text-primary:#111827;
  --text-muted:#9ca3af;
  --shadow-md:0 4px 16px rgba(0,0,0,.08);
}

body{
  font-family:"Segoe UI",system-ui,sans-serif;
  background:#f1f5f9;
  min-height:100vh;
  padding:0;
}

/* ── HEADER ── */
.site-header{
  background:var(--blue);
  padding:14px 20px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.logo-icon{
  width:36px;height:36px;
  background:rgba(255,255,255,.15);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.logo-text{color:#fff;font-size:16px;font-weight:600}
.logo-sub{color:rgba(255,255,255,.55);font-size:11px;margin-top:1px}

/* ── PAGE ── */
.page{
  max-width:720px;
  margin:28px auto;
  padding:0 16px 60px;
}

/* ── LOADING / ERROR STATE ── */
.state-box{
  background:#fff;
  border-radius:16px;
  padding:48px 24px;
  text-align:center;
  box-shadow:var(--shadow-md);
}
.state-icon{font-size:40px;margin-bottom:12px}
.state-title{font-size:17px;font-weight:700;color:var(--text-primary);margin-bottom:6px}
.state-sub{font-size:14px;color:var(--text-muted);line-height:1.6}
.spinner{
  width:36px;height:36px;
  border:3px solid var(--blue-border);
  border-top-color:var(--blue-mid);
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── ASSET CARD ── */
.asset-card{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:var(--shadow-md);
  border:1px solid var(--gray-border);
  margin-bottom:16px;
}

.card-header{
  background:linear-gradient(135deg,var(--blue) 0%,#1d4ed8 100%);
  padding:22px 24px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;flex-wrap:wrap;
}
.asset-name{color:#fff;font-size:20px;font-weight:700;line-height:1.3}
.asset-serial-tag{
  color:rgba(255,255,255,.7);
  font-family:monospace;
  font-size:13px;
  margin-top:4px;
  letter-spacing:.4px;
}

.status-pill{
  padding:5px 14px;
  border-radius:20px;
  font-size:12px;font-weight:700;
  white-space:nowrap;flex-shrink:0;
}
.status-ok{background:var(--green-bg);color:var(--green);border:1.5px solid var(--green-border)}
.status-repair{background:var(--red-bg);color:var(--red);border:1.5px solid var(--red-border)}
.status-spare{background:var(--amber-bg);color:var(--amber);border:1.5px solid #fde68a}

/* ── QR + INFO GRID ── */
.card-body{
  padding:24px;
  display:flex;
  gap:24px;
  align-items:flex-start;
  flex-wrap:wrap;
}

.qr-wrap{
  flex-shrink:0;
  width:170px;height:170px;
  border:1px solid var(--gray-border);
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:var(--gray-light);
  overflow:hidden;
}
.qr-wrap img{width:100%;height:100%;object-fit:contain}

.info-table{flex:1;min-width:200px}
.info-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  padding:10px 0;
  border-bottom:1px dashed var(--gray-border);
  gap:12px;
  font-size:14px;
}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--text-muted);font-weight:500;flex-shrink:0}
.info-value{color:var(--text-primary);font-weight:600;text-align:right;word-break:break-word}

/* ── ACTION BUTTONS ── */
.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.btn{
  padding:10px 18px;
  border-radius:10px;
  font-size:13px;font-weight:600;
  cursor:pointer;border:1.5px solid transparent;
  text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;
  transition:.15s;
}
.btn-primary{background:var(--blue-mid);color:#fff;border-color:var(--blue-mid)}
.btn-primary:hover{background:#1d4ed8}
.btn-outline{background:#fff;color:var(--text-primary);border-color:var(--gray-border)}
.btn-outline:hover{background:var(--gray-light);border-color:#9ca3af}
.btn-teal{background:#0d9488;color:#fff;border-color:#0d9488}
.btn-teal:hover{background:#0f766e}

/* ── ADMIN PANEL ── */
.admin-card{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:var(--shadow-md);
  border:1px solid var(--gray-border);
  display:none;
}
.admin-header{
  background:#111827;
  color:#fff;
  padding:14px 20px;
  font-size:14px;font-weight:700;
  display:flex;align-items:center;gap:8px;
}
.admin-body{padding:20px}

/* ── TIMELINE ── */
.timeline{position:relative;padding-left:36px}
.timeline::before{
  content:"";
  position:absolute;left:11px;top:16px;bottom:16px;
  width:2px;
  background:linear-gradient(to bottom,var(--blue-mid),var(--blue-border));
  border-radius:2px;
}
.tl-entry{position:relative;margin-bottom:12px,}
.tl-dot{
  position:absolute;left:-36px;top:12px;
  width:20px;height:20px;border-radius:50%;
  background:var(--blue-light);border:2px solid var(--blue-mid);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--blue-mid);
}
.tl-item{
  background:var(--gray-light);
  border:1px solid var(--gray-border);
  border-radius:10px;
  padding:10px 14px;
  font-size:13px;
}
.tl-action{font-weight:700;color:var(--text-primary);margin-bottom:3px}
.tl-meta{color:var(--text-muted);font-size:12px}

/* ── MODE TAG ── */
.mode-tag{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;color:var(--text-muted);
  background:var(--gray-light);
  border:1px solid var(--gray-border);
  border-radius:6px;
  padding:4px 10px;
  margin-top:12px;
}

@media(max-width:500px){
  .card-body{flex-direction:column}
  .qr-wrap{width:100%;height:auto;aspect-ratio:1}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="logo-icon">📦</div>
  <div>
    <div class="logo-text">Equipment Management</div>
    <div class="logo-sub">Asset Information</div>
  </div>
</header>

<div class="page">
  <div id="root">
    <div class="state-box">
      <div class="spinner"></div>
      <div class="state-title">กำลังโหลดข้อมูล...</div>
    </div>
  </div>
</div>

<script>
/* =========================
   ✅ BUG FIX: ใช้ "serial" แทน "id" ที่ไม่ถูก define
   รองรับทั้ง /a/:code และ ?serial=xxx
========================= */
function getSerial(){
  // จาก URL path เช่น /a/SN-001
  const pathParts = window.location.pathname.split("/");
  const fromPath = pathParts[pathParts.length - 1];

  // จาก query string เช่น ?serial=SN-001
  const fromQuery = new URLSearchParams(window.location.search).get("serial");

  return fromQuery || (fromPath !== "asset.html" ? decodeURIComponent(fromPath) : "");
}

const serial = getSerial();
let isAdmin = false;

/* =========================
   RENDER HELPERS
========================= */
function getStatusClass(s=""){
  const t = s.toLowerCase();
  if(t.includes("ซ่อม")) return "status-repair";
  if(t.includes("สำรอง")) return "status-spare";
  return "status-ok";
}

/* =========================
   LOAD ASSET (PUBLIC)
   ✅ BUG FIX: endpoint เปลี่ยนเป็น /api/public/asset/:serial
   ซึ่งแก้ใน server.js ให้ดึงจาก Google Sheets แล้ว
========================= */
async function loadAsset(){
  if(!serial){
    document.getElementById("root").innerHTML = `
      <div class="state-box">
        <div class="state-icon">⚠️</div>
        <div class="state-title">ไม่พบ Serial Number</div>
        <div class="state-sub">URL ไม่ถูกต้อง กรุณาสแกน QR ใหม่</div>
      </div>`;
    return;
  }

  try {
    const res = await fetch(`/api/public/asset/${encodeURIComponent(serial)}`);

    if(!res.ok){
      throw new Error("not found");
    }

    const d = await res.json();

    /* ── render ── */
    const statusClass = getStatusClass(d.status);

    const adminSection = `
      <div class="admin-card" id="adminCard">
        <div class="admin-header">🔐 Admin Control</div>
        <div class="admin-body">
          <div class="timeline" id="timeline">
            <div style="color:#6b7280;font-size:13px">กำลังโหลดประวัติ...</div>
          </div>
          <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
            <a class="btn btn-primary" href="/trace.html?serial=${encodeURIComponent(serial)}">📋 ดูประวัติเต็ม</a>
            <a class="btn btn-teal" href="/qr.html?serial=${encodeURIComponent(serial)}">🖨️ พิมพ์ QR</a>
          </div>
        </div>
      </div>`;

    document.getElementById("root").innerHTML = `
      <div class="actions">
        <a class="btn btn-outline" href="/trace.html?serial=${encodeURIComponent(serial)}">📋 ประวัติการเคลื่อนย้าย</a>
        <button class="btn btn-outline" onclick="window.print()">🖨️ พิมพ์</button>
      </div>

      <div class="asset-card">
        <div class="card-header">
          <div>
            <div class="asset-name">${d.name || serial}</div>
            <div class="asset-serial-tag">S/N : ${d.serialNumber || serial}</div>
          </div>
          <span class="status-pill ${statusClass}">${d.status || "ไม่ระบุ"}</span>
        </div>
        <div class="card-body">
          <div class="qr-wrap">
            ${d.qr ? `<img src="${d.qr}" alt="QR Code">` : `<span style="color:#9ca3af;font-size:12px">ไม่มี QR</span>`}
          </div>
          <div class="info-table">
            <div class="info-row">
              <span class="info-label">Part Number</span>
              <span class="info-value">${d.partNumber || "-"}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Asset ID</span>
              <span class="info-value">${d.assetId || "-"}</span>
            </div>
            <div class="info-row">
              <span class="info-label">ไซต์งาน</span>
              <span class="info-value">${d.siteName || "-"}</span>
            </div>
            <div class="info-row">
              <span class="info-label">สถานที่</span>
              <span class="info-value">${d.location || "-"}</span>
            </div>
            <div class="info-row">
              <span class="info-label">ผู้รับผิดชอบ</span>
              <span class="info-value">${d.user || "-"}</span>
            </div>
            <div class="info-row">
              <span class="info-label">อัปเดตล่าสุด</span>
              <span class="info-value">${d.date || "-"}</span>
            </div>
          </div>
        </div>
      </div>

      <div id="modeTag" class="mode-tag">👁️ Public View (read-only)</div>

      ${adminSection}
    `;

    /* check auth หลัง render */
    checkAuth();

  } catch(e){
    console.error(e);
    document.getElementById("root").innerHTML = `
      <div class="state-box">
        <div class="state-icon">📭</div>
        <div class="state-title">ไม่พบอุปกรณ์</div>
        <div class="state-sub">Serial Number <strong>${serial}</strong><br>ไม่พบในระบบ กรุณาตรวจสอบ</div>
        <a href="/trace.html" style="margin-top:16px;display:inline-block;color:#2563eb;font-size:14px">← ค้นหาใหม่</a>
      </div>`;
  }
}

/* =========================
   CHECK AUTH
========================= */
async function checkAuth(){
  try {
    const res = await fetch("/api/check-auth");
    const data = await res.json();

    if(data.loggedIn){
      isAdmin = true;
      const adminCard = document.getElementById("adminCard");
      const modeTag = document.getElementById("modeTag");
      if(adminCard) adminCard.style.display = "block";
      if(modeTag) modeTag.innerHTML = `🔐 Admin Mode — ${data.username}`;
      loadHistory();
    }
  } catch(e){ /* not logged in, show public view */ }
}

/* =========================
   LOAD HISTORY (ADMIN)
========================= */
async function loadHistory(){
  try {
    const res = await fetch(`/api/asset-history/${encodeURIComponent(serial)}`);
    const logs = await res.json();

    const tl = document.getElementById("timeline");
    if(!tl) return;

    if(!logs.length){
      tl.innerHTML = `<div style="color:#6b7280;font-size:13px">ไม่มีประวัติ</div>`;
      return;
    }

    tl.innerHTML = logs.slice(0,5).map(l => `
      <div class="tl-entry">
        <div class="tl-dot">→</div>
        <div class="tl-item">
          <div class="tl-action">${l.action || "-"}</div>
          <div class="tl-meta">📅 ${l.date || "-"} · ${l.to || "-"} · ${l.user || "System"}</div>
          ${l.remark && l.remark !== "-" ? `<div class="tl-meta" style="margin-top:3px">💬 ${l.remark}</div>` : ""}
        </div>
      </div>`).join("");

  } catch(e){
    const tl = document.getElementById("timeline");
    if(tl) tl.innerHTML = `<div style="color:#ef4444;font-size:13px">โหลดประวัติไม่ได้</div>`;
  }
}

/* INIT */
loadAsset();
</script>
</body>
</html>
