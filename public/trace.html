<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset Traceability — Equipment Management</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --blue:#1e3a8a;
  --blue-mid:#2563eb;
  --blue-light:#eff6ff;
  --blue-border:#bfdbfe;
  --green:#166534;
  --green-bg:#f0fdf4;
  --green-border:#bbf7d0;
  --amber:#92400e;
  --amber-bg:#fffbeb;
  --amber-border:#fde68a;
  --red:#991b1b;
  --red-bg:#fef2f2;
  --red-border:#fecaca;
  --gray:#374151;
  --gray-light:#f9fafb;
  --gray-border:#e5e7eb;
  --text-primary:#111827;
  --text-secondary:#6b7280;
  --text-muted:#9ca3af;
  --white:#ffffff;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);
  --shadow-lg:0 10px 30px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
}

body{
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  background:#f1f5f9;
  color:var(--text-primary);
  min-height:100vh;
  font-size:15px;
  line-height:1.6;
}

/* ── HEADER ── */
.site-header{
  background:var(--blue);
  padding:16px 0;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.site-header-inner{
  max-width:900px;
  margin:auto;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-icon{
  width:36px;height:36px;
  background:rgba(255,255,255,.15);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
}
.logo-text{color:#fff;font-size:16px;font-weight:600;letter-spacing:.3px}
.logo-sub{color:rgba(255,255,255,.6);font-size:12px;margin-top:1px}

/* ── SEARCH BAR IN HEADER ── */
.header-search{
  display:flex;
  gap:8px;
  flex:1;
  max-width:420px;
}
.header-search input{
  flex:1;
  padding:9px 14px;
  border-radius:var(--radius-sm);
  border:1.5px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:14px;
  outline:none;
  transition:.2s;
}
.header-search input::placeholder{color:rgba(255,255,255,.5)}
.header-search input:focus{
  border-color:rgba(255,255,255,.6);
  background:rgba(255,255,255,.18);
}
.header-search button{
  padding:9px 18px;
  border-radius:var(--radius-sm);
  background:#fff;
  color:var(--blue);
  border:none;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
  white-space:nowrap;
}
.header-search button:hover{background:#e0e7ff}

/* ── MAIN LAYOUT ── */
.page{
  max-width:900px;
  margin:32px auto;
  padding:0 24px 60px;
}

/* ── ASSET INFO CARD ── */
.asset-card{
  background:var(--white);
  border-radius:var(--radius-lg);
  border:1px solid var(--gray-border);
  box-shadow:var(--shadow-md);
  overflow:hidden;
  margin-bottom:24px;
}
.asset-card-header{
  background:linear-gradient(135deg,var(--blue) 0%,#1d4ed8 100%);
  padding:22px 28px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
  flex-wrap:wrap;
}
.asset-name{color:#fff;font-size:20px;font-weight:700}
.asset-serial-tag{
  color:rgba(255,255,255,.75);
  font-size:13px;
  margin-top:5px;
  font-family:monospace;
  letter-spacing:.5px;
}
.status-pill{
  padding:5px 14px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  letter-spacing:.3px;
  white-space:nowrap;
  flex-shrink:0;
}
.status-ok{background:var(--green-bg);color:var(--green);border:1.5px solid var(--green-border)}
.status-repair{background:var(--red-bg);color:var(--red);border:1.5px solid var(--red-border)}
.status-spare{background:var(--amber-bg);color:var(--amber);border:1.5px solid var(--amber-border)}

.asset-meta-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:0;
  border-top:1px solid var(--gray-border);
}
.meta-cell{
  padding:16px 24px;
  border-right:1px solid var(--gray-border);
}
.meta-cell:last-child{border-right:none}
.meta-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;font-weight:600}
.meta-value{font-size:14px;color:var(--text-primary);font-weight:500}

/* ── SECTION HEADER ── */
.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}
.section-title{
  font-size:16px;
  font-weight:700;
  color:var(--text-primary);
  display:flex;
  align-items:center;
  gap:8px;
}
.count-badge{
  background:var(--blue-light);
  color:var(--blue-mid);
  font-size:12px;
  font-weight:600;
  padding:3px 9px;
  border-radius:20px;
  border:1px solid var(--blue-border);
}

/* ── TIMELINE ── */
.timeline{
  position:relative;
  padding-left:44px;
}
.timeline::before{
  content:"";
  position:absolute;
  left:17px;top:24px;bottom:24px;
  width:2px;
  background:linear-gradient(to bottom,var(--blue-mid),var(--blue-border));
  border-radius:2px;
}

.tl-entry{
  position:relative;
  margin-bottom:16px;
}
.tl-entry:last-child{margin-bottom:0}

/* dot */
.tl-dot{
  position:absolute;
  left:-44px;top:18px;
  width:26px;height:26px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;
  z-index:1;
  box-shadow:0 0 0 4px #f1f5f9;
}
.dot-register{background:var(--green-bg);border:2px solid #4ade80;color:var(--green)}
.dot-move{background:var(--blue-light);border:2px solid var(--blue-mid);color:var(--blue-mid)}
.dot-repair{background:var(--red-bg);border:2px solid #f87171;color:var(--red)}
.dot-return{background:var(--amber-bg);border:2px solid #fbbf24;color:var(--amber)}
.dot-current{background:var(--blue-mid);border:2px solid #93c5fd;color:#fff;box-shadow:0 0 0 4px #dbeafe}

/* card */
.tl-card{
  background:var(--white);
  border:1px solid var(--gray-border);
  border-radius:var(--radius-md);
  padding:16px 20px;
  box-shadow:var(--shadow-sm);
  transition:.15s;
}
.tl-card:hover{box-shadow:var(--shadow-md);border-color:#d1d5db}

.tl-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.tl-action{font-size:15px;font-weight:700;color:var(--text-primary)}
.tl-date{
  font-size:12px;
  color:var(--text-muted);
  background:var(--gray-light);
  padding:3px 10px;
  border-radius:20px;
  white-space:nowrap;
  border:1px solid var(--gray-border);
}

.tl-route{
  display:flex;
  align-items:center;
  gap:8px;
  margin:8px 0;
  flex-wrap:wrap;
}
.route-chip{
  padding:4px 12px;
  border-radius:var(--radius-sm);
  font-size:13px;
  font-weight:500;
  background:var(--gray-light);
  border:1px solid var(--gray-border);
  color:var(--text-primary);
}
.route-chip.dest{
  background:var(--blue-light);
  border-color:var(--blue-border);
  color:var(--blue);
}
.route-arrow{color:var(--text-muted);font-size:14px}

.tl-user-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
  flex-wrap:wrap;
}
.user-chip{
  display:flex;align-items:center;gap:5px;
  font-size:12px;color:var(--text-secondary);
}
.user-chip .avatar{
  width:22px;height:22px;
  border-radius:50%;
  background:var(--blue-light);
  color:var(--blue-mid);
  font-size:10px;
  font-weight:700;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--blue-border);
}

.tl-remark{
  margin-top:10px;
  background:var(--gray-light);
  border-left:3px solid var(--blue-mid);
  padding:8px 12px;
  border-radius:0 6px 6px 0;
  font-size:13px;
  color:var(--text-secondary);
}
.remark-label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}

/* ── CURRENT TAG ── */
.current-tag{
  display:inline-block;
  background:var(--blue-mid);
  color:#fff;
  font-size:10px;
  font-weight:700;
  letter-spacing:.5px;
  padding:2px 8px;
  border-radius:20px;
  margin-left:6px;
  vertical-align:middle;
}

/* ── LOADING / EMPTY / ERROR ── */
.state-box{
  background:var(--white);
  border:1px solid var(--gray-border);
  border-radius:var(--radius-lg);
  padding:60px 24px;
  text-align:center;
  box-shadow:var(--shadow-sm);
}
.state-icon{font-size:48px;margin-bottom:12px;opacity:.6}
.state-title{font-size:18px;font-weight:700;color:var(--text-primary);margin-bottom:6px}
.state-sub{font-size:14px;color:var(--text-secondary)}

.spinner{
  width:36px;height:36px;
  border:3px solid var(--blue-border);
  border-top-color:var(--blue-mid);
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── ACTIONS BAR ── */
.actions-bar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:24px;
}
.btn{
  padding:9px 18px;
  border-radius:var(--radius-sm);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  border:1.5px solid transparent;
  transition:.15s;
  display:flex;align-items:center;gap:6px;
  text-decoration:none;
}
.btn-outline{
  background:var(--white);
  border-color:var(--gray-border);
  color:var(--text-primary);
}
.btn-outline:hover{border-color:#9ca3af;background:var(--gray-light)}
.btn-primary{
  background:var(--blue-mid);
  color:#fff;
  border-color:var(--blue-mid);
}
.btn-primary:hover{background:#1d4ed8}
.btn-green{
  background:var(--green-bg);
  color:var(--green);
  border-color:var(--green-border);
}
.btn-green:hover{background:#dcfce7}

/* ── SEARCH HINT ── */
.search-hint{
  background:var(--blue-light);
  border:1px solid var(--blue-border);
  border-radius:var(--radius-md);
  padding:20px 24px;
  text-align:center;
  margin-top:32px;
}
.search-hint p{color:var(--blue);font-size:14px;line-height:1.7}

/* ── ACCESS DENIED ── */
.access-denied{
  background:var(--white);
  border:1px solid var(--red-border);
  border-radius:var(--radius-lg);
  padding:60px 24px;
  text-align:center;
  box-shadow:var(--shadow-sm);
}
.access-denied .icon{font-size:48px;margin-bottom:12px}
.access-denied .title{font-size:18px;font-weight:700;color:var(--text-primary);margin-bottom:6px}
.access-denied .sub{font-size:14px;color:var(--text-secondary)}
.access-denied .btn{
  margin-top:16px;
  display:inline-block;
}

/* ── MODAL ── */
.mo{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:20px}
.mo.open{display:flex}
.mb{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:480px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 40px 80px rgba(0,0,0,.2)}
.mb-wide{max-width:560px}
.mh{padding:20px 24px 16px;border-bottom:1px solid var(--gray-border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.mh-title{font-size:16px;font-weight:800;color:var(--text-primary)}
.mc{width:30px;height:30px;border-radius:50%;background:var(--gray-light);border:none;cursor:pointer;font-size:16px;color:var(--text-muted);display:flex;align-items:center;justify-content:center;transition:.15s}
.mc:hover{background:var(--gray-border);color:var(--text-primary)}
.mbd{padding:20px 24px;overflow-y:auto;flex:1}
.mf{padding:16px 24px;border-top:1px solid var(--gray-border);display:flex;justify-content:flex-end;gap:10px;flex-shrink:0}

.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
.ff label{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:5px}
.ff input,.ff select,.ff textarea{width:100%;padding:9px 12px;border:1.5px solid var(--gray-border);border-radius:var(--radius-sm);font-size:13px;color:var(--text-primary);outline:none;transition:.2s;background:#fff}
.ff input:focus,.ff select:focus,.ff textarea:focus{border-color:var(--blue-mid);box-shadow:0 0 0 3px rgba(37,99,235,.1)}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .page{padding:0 16px 40px}
  .asset-card-header{padding:18px 20px}
  .asset-name{font-size:17px}
  .meta-cell{padding:12px 16px}
  .tl-card{padding:14px 16px}
  .timeline{padding-left:38px}
  .tl-dot{left:-38px;width:22px;height:22px;font-size:10px}
  .timeline::before{left:14px}
  .site-header-inner{flex-direction:column;align-items:flex-start}
  .header-search{max-width:100%;width:100%}
  .mb{max-width:100%}
}

/* ── PRINT ── */
@media print{
  .site-header,.actions-bar,.header-search button,.mo{display:none!important}
  body{background:#fff}
  .page{margin:0;padding:0 16px}
  .tl-card{box-shadow:none!important;border:1px solid #e5e7eb!important}
  .asset-card{box-shadow:none!important}
}

/* ═══════════════════════════════════════════════════════════════
   ICON DESIGN SYSTEM — Premium Material Symbols
   Size × Weight × Fill × Grade × Color × State
═══════════════════════════════════════════════════════════════ */

/* Base icon element */
.material-symbols-rounded {
  font-family: 'Material Symbols Rounded';
  font-style: normal;
  font-variation-settings:
    'wght' var(--icon-w-regular, 400),
    'FILL' var(--icon-fill-none, 0),
    'GRAD' var(--icon-grade-normal, 0),
    'opsz' var(--icon-opsz-md, 24);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  line-height: 1;
  vertical-align: middle;
  transition:
    font-variation-settings var(--icon-transition),
    color var(--icon-transition),
    transform var(--icon-transition);
}

/* ─── Size Modifiers ─── */
.icon-xs { font-size: var(--icon-xs); --icon-opsz-md: var(--icon-opsz-sm); }
.icon-sm { font-size: var(--icon-sm); --icon-opsz-md: var(--icon-opsz-sm); }
.icon-md { font-size: var(--icon-md); --icon-opsz-md: var(--icon-opsz-md); }
.icon-lg { font-size: var(--icon-lg); --icon-opsz-md: var(--icon-opsz-lg); }
.icon-xl { font-size: var(--icon-xl); --icon-opsz-md: var(--icon-opsz-lg); }
.icon-2xl { font-size: var(--icon-2xl); --icon-opsz-md: var(--icon-opsz-xl); }

/* ─── Weight Modifiers ─── */
.icon-light     { --icon-w-regular: var(--icon-w-light); }
.icon-regular   { --icon-w-regular: var(--icon-w-regular); }
.icon-medium    { --icon-w-regular: var(--icon-w-medium); }
.icon-semibold  { --icon-w-regular: var(--icon-w-semibold); }
.icon-bold      { --icon-w-regular: var(--icon-w-bold); }

/* ─── Fill Modifiers (semantic) ─── */
.icon-outline   { --icon-fill-none: var(--icon-fill-none); }
.icon-hover     { --icon-fill-none: var(--icon-fill-subtle); }
.icon-active    { --icon-fill-none: var(--icon-fill-half); }
.icon-filled    { --icon-fill-none: var(--icon-fill-full); }

/* ─── Grade Modifiers ─── */
.icon-grade-normal { --icon-grade-normal: var(--icon-grade-normal); }
.icon-grade-dark   { --icon-grade-normal: var(--icon-grade-dark); }
.icon-grade-light  { --icon-grade-normal: var(--icon-grade-light); }

/* ─── Semantic Color Variants ─── */
.icon-primary   { color: var(--blue); }
.icon-secondary { color: var(--tsub); }
.icon-muted     { color: var(--tmuted); }
.icon-success   { color: var(--emerald); }
.icon-warning   { color: var(--amber); }
.icon-danger    { color: var(--red); }
.icon-purple    { color: var(--purple); }
.icon-white     { color: #fff; }
.icon-inherit   { color: inherit; }

/* ─── Composite Utility Classes ─── */
.nav-icon {
  --icon-w-regular: var(--icon-w-medium);
  --icon-fill-none: var(--icon-fill-none);
  --icon-grade-normal: var(--icon-grade-normal);
  --icon-opsz-md: var(--icon-opsz-md);
  font-size: var(--icon-md);
  color: var(--tsub);
  transition: color var(--icon-transition), font-variation-settings var(--icon-transition);
}
.nav-icon:hover,
.nav-icon.active {
  color: var(--blue);
  --icon-fill-none: var(--icon-fill-full);
  --icon-w-regular: var(--icon-w-semibold);
}

.btn-icon {
  --icon-w-regular: var(--icon-w-semibold);
  --icon-fill-none: var(--icon-fill-none);
  font-size: var(--icon-sm);
}
.btn-primary .btn-icon    { color: var(--blue); }
.btn-primary:hover .btn-icon    { --icon-fill-none: var(--icon-fill-subtle); }
.btn-primary:active .btn-icon   { --icon-fill-none: var(--icon-fill-half); }
.btn-secondary .btn-icon  { color: var(--tsub); }
.btn-outline .btn-icon    { color: var(--blue); }
.btn-ghost .btn-icon      { color: var(--tsub); }
.btn-ghost:hover .btn-icon    { color: var(--blue); --icon-fill-none: var(--icon-fill-subtle); }

.status-icon {
  --icon-w-regular: var(--icon-w-semibold);
  --icon-fill-none: var(--icon-fill-full);
  font-size: var(--icon-xs);
}
.status-success .status-icon { color: var(--emerald); }
.status-warning .status-icon { color: var(--amber); }
.status-danger .status-icon  { color: var(--red); }
.status-info .status-icon    { color: var(--blue); }

.card-icon {
  --icon-w-regular: var(--icon-w-regular);
  --icon-fill-none: var(--icon-fill-none);
  font-size: var(--icon-xl);
  color: var(--blue);
}
.card:hover .card-icon {
  --icon-fill-none: var(--icon-fill-subtle);
  --icon-w-regular: var(--icon-w-medium);
}

.fab-icon {
  --icon-w-regular: var(--icon-w-bold);
  --icon-fill-none: var(--icon-fill-full);
  font-size: var(--icon-lg);
  color: #fff;
}

.table-action-icon {
  --icon-w-regular: var(--icon-w-medium);
  --icon-fill-none: var(--icon-fill-none);
  font-size: var(--icon-sm);
  color: var(--tmuted);
  transition: color var(--icon-transition), font-variation-settings var(--icon-transition), transform var(--icon-transition);
}
.table-action-icon:hover {
  color: var(--blue);
  --icon-fill-none: var(--icon-fill-subtle);
  transform: scale(1.1);
}

.empty-icon {
  --icon-w-regular: var(--icon-w-light);
  --icon-fill-none: var(--icon-fill-none);
  font-size: var(--icon-2xl);
  color: var(--g300);
}

.header-icon {
  --icon-w-regular: var(--icon-w-semibold);
  --icon-fill-none: var(--icon-fill-full);
  font-size: var(--icon-lg);
  color: var(--ink);
}

.material-symbols-rounded:not(.no-transition) {
  transition: font-variation-settings 150ms ease, color 150ms ease, transform 150ms ease;
}

.material-symbols-rounded:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
  border-radius: 4px;
}

@media (prefers-reduced-motion: reduce) {
  .material-symbols-rounded {
    transition: none;
  }
}


/* ── Global: ลบเส้นใต้ anchor ทุกแบบ (รวม icon-button ที่ JS สร้างขึ้น) ── */
a,
a:link,
a:visited { text-decoration: none; }
a:hover,
a:focus { text-decoration: none; }

<body>

<header class="site-header">
  <div class="site-header-inner">
    <div class="logo-wrap">

<script>
const root = document.getElementById("root");

function getSerial(){
  return new URLSearchParams(window.location.search).get("serial") || "";
}

// <span class="material-symbols-rounded icon-sm icon-regular icon-filled icon-success">check_circle</span> ฟังก์ชันตรวจสอบแหล่งที่มาของการเข้าถึง
function getSource() {
  const q = new URLSearchParams(window.location.search);
  return q.get("from") || "external";
}

function search(){
  const v = document.getElementById("serialInput").value.trim();
  if(!v){ return; }
  window.location.href = `trace.html?serial=${encodeURIComponent(v)}&from=internal`;
}

function getStatusClass(s=""){
  const t = s.toLowerCase();
  if(t.includes("ซ่อม")) return "status-repair";
  if(t.includes("สำรอง")) return "status-spare";
  return "status-ok";
}

function getDotClass(action=""){
  const a = action.toLowerCase();
  if(a.includes("ลงทะเบียน") || a.includes("เพิ่ม")) return "dot-register";
  if(a.includes("ซ่อม")) return "dot-repair";
  if(a.includes("คืน")) return "dot-return";
  return "dot-move";
}

function getDotIcon(action=""){
  const a = action.toLowerCase();
  if(a.includes("ลงทะเบียน") || a.includes("เพิ่ม")) return "✦";
  if(a.includes("ซ่อม")) return "<span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">build</span>";
  if(a.includes("คืน")) return "↩";
  return "→";
}

function getInitials(name=""){
  const parts = name.trim().split(" ").filter(Boolean);
  if(!parts.length) return "?";
  return parts.length > 1
    ? (parts[0][0] + parts[parts.length-1][0]).toUpperCase()
    : parts[0].slice(0,2).toUpperCase();
}

/* ── MODAL CONTROL ── */
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

/* ── เปิด Transfer Modal จาก trace.html ── */
function openTransferFromTrace() {
  const serial = getSerial(); // ดึง Serial จาก URL
  if (!serial) {
    alert('⚠ ไม่พบ Serial Number');
    return;
  }

  // ตั้งค่า Serial ใน Modal
  document.getElementById('transferSerialTitle').textContent = serial;
  
  // โหลดข้อมูลฟาร์มลง dropdown
  loadFarmSitesForTrace();
  
  // เปิด Modal
  openModal('transferModal');
}

/* ── โหลดฟาร์มลง dropdown ── */
async function loadFarmSitesForTrace() {
  try {
    const res = await fetch('/api/farm-sites');
    const sites = await res.json();
    const sel = document.getElementById('trSiteSelect');
    sel.innerHTML = '<option value="">-- เลือกฟาร์ม --</option>';
    sites.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.siteId;
      opt.textContent = `${s.siteName} (${s.farmType})`;
      sel.appendChild(opt);
    });
  } catch(e) {
    console.error('Load farm sites error:', e);
  }
}

/* ── ฟังก์ชันอื่น ๆ ที่จำเป็น ── */
function onActionChange() {
  const action = document.getElementById('transferAction').value;
  const fs = document.getElementById('farmSection');
  if (action.includes('ซ่อม') || action.includes('คืนคลัง')) {
    if (fs) fs.style.display = 'none';
    document.getElementById('transferStatus').value = action.includes('ซ่อม') ? 'ส่งซ่อม' : 'สำรอง';
  } else {
    if (fs) fs.style.display = 'block';
  }
}

function onFarmTypeChange() {
  const ft = document.getElementById('trFarmType').value;
  const at = document.getElementById('trAnimalType');
  at.innerHTML = '<option value="">-- ไม่ระบุ --</option>';
  if (ft === 'สัตว์ปีก') {
    ['ไก่เนื้อ','ไก่ไข่','เป็ด','ห่าน','อื่นๆ'].forEach(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = v; at.appendChild(o);
    });
  } else if (ft === 'สัตว์บก') {
    ['วัว','ควาย','แพะ','แกะ','ม้า','อื่นๆ'].forEach(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = v; at.appendChild(o);
    });
  } else if (ft === 'สุกร') {
    ['สุกรพ่อพันธุ์','สุกรแม่พันธุ์','ลูกสุกร','สุกรขุน'].forEach(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = v; at.appendChild(o);
    });
  }
}

async function onSiteSelect(siteId) {
  if (!siteId) {
    document.getElementById('transferSite').value = '';
    document.getElementById('trHouseSelect').innerHTML = '<option value="">-- เลือกไซต์ก่อน --</option>';
    return;
  }
  try {
    const res = await fetch(`/api/farm-houses/${encodeURIComponent(siteId)}`);
    const houses = await res.json();
    const sel = document.getElementById('trHouseSelect');
    sel.innerHTML = '<option value="">-- เลือกโรงเรือน --</option>';
    houses.forEach(h => {
      const o = document.createElement('option');
      o.value = h.houseId;
      o.dataset.name = h.houseName;
      o.textContent = `${h.houseName} (${h.houseType})`;
      sel.appendChild(o);
    });
    // ดึงชื่อฟาร์ม
    const sites = await (await fetch('/api/farm-sites')).json();
    const site = sites.find(s => s.siteId === siteId);
    if (site) {
      document.getElementById('transferSite').value = site.siteName;
      document.getElementById('trFarmType').value = site.farmType || '';
    }
  } catch(e) {
    console.error('Load houses error:', e);
  }
}

function onHouseSelect(houseId) {
  const sel = document.getElementById('trHouseSelect');
  const opt = sel.options[sel.selectedIndex];
  if (opt && opt.dataset.name) {
    document.getElementById('trHouseName').value = opt.dataset.name;
    document.getElementById('trHouseId').value = houseId;
  }
}

/* ── ส่งข้อมูลโอนย้าย ── */
async function submitTransferAction() {
  const serial = document.getElementById('transferSerialTitle').textContent;
  const action = document.getElementById('transferAction').value;
  const status = document.getElementById('transferStatus').value;
  const location = document.getElementById('transferLocation').value.trim();
  const siteName = document.getElementById('transferSite').value.trim();
  const user = document.getElementById('transferUser').value.trim();
  const remark = document.getElementById('transferRemark').value.trim();
  const farmType = document.getElementById('trFarmType')?.value || '-';
  const animalType = document.getElementById('trAnimalType')?.value || '-';
  const houseId = document.getElementById('trHouseId')?.value || '-';
  const houseName = document.getElementById('trHouseName')?.value.trim() || '-';

  if (!siteName) {
    alert('กรุณาระบุไซต์งานปลายทาง');
    return;
  }

  try {
    const r = await fetch('/api/transfer-asset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        serialNumber: serial,
        action,
        status,
        location,
        siteName,
        user,
        remark,
        fromLocation: '-',
        farmType,
        animalType,
        houseId,
        houseName
      })
    });
    const d = await r.json();
    if (d.success) {
      alert('<span class="material-symbols-rounded icon-sm icon-regular icon-filled icon-success">check_circle</span> โอนย้ายสำเร็จ');
      closeModal('transferModal');
      // รีโหลดหน้าประวัติ
      window.location.reload();
    } else {
      alert('<span class="material-symbols-rounded icon-sm icon-regular icon-filled icon-danger">cancel</span> เกิดข้อผิดพลาด: ' + (d.error || ''));
    }
  } catch(e) {
    alert('<span class="material-symbols-rounded icon-sm icon-regular icon-filled icon-danger">cancel</span> ไม่สามารถเชื่อมต่อได้');
    console.error(e);
  }
}

/* ── คลิกนอก Modal เพื่อปิด ── */
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('mo')) {
    e.target.classList.remove('open');
  }
});

async function loadFromURL(){
  const serial = getSerial();
  const source = getSource();  // <span class="material-symbols-rounded icon-sm icon-regular icon-filled icon-success">check_circle</span> ตรวจสอบแหล่งที่มา

  if(serial) document.getElementById("serialInput").value = serial;

  // <span class="material-symbols-rounded icon-sm icon-regular icon-filled icon-success">check_circle</span> ถ้าไม่มี serial หรือมาจากภายนอก → redirect ไป public view
  if(!serial){
    root.innerHTML = `
      <div class="search-hint">
        <div style="font-size:36px;margin-bottom:10px"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary icon-secondary">search</span></div>
        <p><strong>ระบุ Serial Number</strong> ในช่องค้นหาด้านบน<br>เพื่อดูประวัติการเคลื่อนย้ายอุปกรณ์ทั้งหมด</p>
      </div>`;
    return;
  }

  // <span class="material-symbols-rounded icon-sm icon-regular icon-filled icon-success">check_circle</span> ถ้ามาจากภายนอก (ไม่มี ?from=internal) → redirect ไป asset.html (Public View)
  if(source !== "internal"){
    // เปลี่ยนเส้นทางไปที่ asset.html (Public View)
    window.location.href = `/a/${encodeURIComponent(serial)}`;
    return;
  }

  // --- ถ้ามาจาก internal → แสดงประวัติเต็ม ---
  root.innerHTML = `
    <div class="state-box">
      <div class="spinner"></div>
      <div class="state-title">กำลังโหลดข้อมูล...</div>
      <div class="state-sub">${serial}</div>
    </div>`;

  try {
    const res = await fetch(`/api/public-asset-history/${encodeURIComponent(serial)}`);
    const data = await res.json();

    if(!Array.isArray(data) || data.length === 0){
      root.innerHTML = `
        <div class="state-box">
          <div class="state-icon"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">mail</span></div>
          <div class="state-title">ไม่พบข้อมูล</div>
          <div class="state-sub">Serial Number <strong>${serial}</strong> ไม่พบในระบบ<br>กรุณาตรวจสอบและลองใหม่อีกครั้ง</div>
        </div>`;
      return;
    }

    /* ── สร้าง asset info จาก entry แรกสุด (ล่าสุด index 0) และล่าสุด ── */
    const latest = data[0];
    const oldest = data[data.length - 1];

    // ── asset card ──
const displaySerial = latest.serialNumber || serial; // ใช้ Serial เต็มจากประวัติ (ถ้ามี)
const assetCardHTML = `
  <div class="asset-card" style="margin-bottom:24px">
    <div class="asset-card-header">
      <div>
        <div class="asset-name">${latest.remark && latest.remark.includes(":") ? latest.remark.split(":").pop().trim() : displaySerial}</div>
        <div class="asset-serial-tag">S/N : ${displaySerial}</div>
      </div>
      <span class="status-pill status-ok"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">place</span> ${latest.to || "ในระบบ"}</span>
    </div>
    <div class="asset-meta-grid">
      <div class="meta-cell">
        <div class="meta-label">รายการทั้งหมด</div>
        <div class="meta-value">${data.length} รายการ</div>
      </div>
      <div class="meta-cell">
        <div class="meta-label">ลงทะเบียนเมื่อ</div>
        <div class="meta-value">${oldest.date || "-"}</div>
      </div>
      <div class="meta-cell">
        <div class="meta-label">อัปเดตล่าสุด</div>
        <div class="meta-value">${latest.date || "-"}</div>
      </div>
      <div class="meta-cell">
        <div class="meta-label">ตำแหน่งล่าสุด</div>
        <div class="meta-value">${latest.to || "-"}</div>
      </div>
    </div>
  </div>`;
    /* ── actions bar ── */
    const actionsHTML = `
      <div class="actions-bar">
        <button class="btn btn-outline" onclick="window.print()"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">print</span> พิมพ์รายงาน</button>
        <button class="btn btn-green" onclick="window.history.back()">← ย้อนกลับ</button>
        <button class="btn btn-primary" onclick="openTransferFromTrace()"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">local_shipping</span> โอนย้ายอุปกรณ์</button>
      </div>`;

    /* ── timeline ── */
    let tlHTML = "";
    data.forEach((item, idx) => {
      const isFirst = idx === 0;
      const dotClass = isFirst ? "dot-current" : getDotClass(item.action);
      const dotIcon  = isFirst ? "<span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">place</span>" : getDotIcon(item.action);
      const initials = getInitials(item.user);

      const routeHTML = (item.from && item.from !== "-")
        ? `<div class="tl-route">
            <span class="route-chip">${item.from}</span>
            <span class="route-arrow">→</span>
            <span class="route-chip dest">${item.to || "-"}</span>
           </div>`
        : (item.to && item.to !== "-")
          ? `<div class="tl-route"><span class="route-chip dest"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">place</span> ${item.to}</span></div>`
          : "";

      const remarkHTML = (item.remark && item.remark !== "-")
        ? `<div class="tl-remark">
            <div class="remark-label">หมายเหตุ</div>
            ${item.remark}
           </div>`
        : "";

      tlHTML += `
        <div class="tl-entry">
          <div class="tl-dot ${dotClass}">${dotIcon}</div>
          <div class="tl-card">
            <div class="tl-top">
              <div class="tl-action">
                ${item.action || "-"}
                ${isFirst ? '<span class="current-tag">ล่าสุด</span>' : ""}
              </div>
              <div class="tl-date"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">event</span> ${item.date || "-"}</div>
            </div>
            ${routeHTML}
            <div class="tl-user-row">
              <div class="user-chip">
                <div class="avatar">${initials}</div>
                <span>${item.user || "System"}</span>
              </div>
            </div>
            ${remarkHTML}
          </div>
        </div>`;
    });

    /* ── section header ── */
    const sectionHTML = `
      <div class="section-head">
        <div class="section-title">
          <span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">assignment</span> ประวัติการเคลื่อนย้าย
          <span class="count-badge">${data.length} รายการ</span>
        </div>
      </div>
      <div class="timeline">${tlHTML}</div>`;

    root.innerHTML = assetCardHTML + actionsHTML + sectionHTML;

  } catch(err) {
    console.error(err);
    root.innerHTML = `
      <div class="state-box">
        <div class="state-icon">⚠</div>
        <div class="state-title">เกิดข้อผิดพลาด</div>
        <div class="state-sub">ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่</div>
      </div>`;
  }
}

window.onload = loadFromURL;
