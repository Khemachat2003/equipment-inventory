<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset Traceability — Equipment Management</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --blue:#1e3a8a;
  --blue-mid:#2563eb;
  --blue-light:#eff6ff;
  --blue-border:#bfdbfe;
  --green:#166534;
  --green-bg:#f0fdf4;
  --green-border:#bbf7d0;
  --amber:#92400e;
  --amber-bg:#fffbeb;
  --amber-border:#fde68a;
  --red:#991b1b;
  --red-bg:#fef2f2;
  --red-border:#fecaca;
  --gray:#374151;
  --gray-light:#f9fafb;
  --gray-border:#e5e7eb;
  --text-primary:#111827;
  --text-secondary:#6b7280;
  --text-muted:#9ca3af;
  --white:#ffffff;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);
  --shadow-lg:0 10px 30px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
}

body{
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  background:#f1f5f9;
  color:var(--text-primary);
  min-height:100vh;
  font-size:15px;
  line-height:1.6;
}

/* ── HEADER ── */
.site-header{
  background:var(--blue);
  padding:16px 0;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.site-header-inner{
  max-width:900px;
  margin:auto;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-icon{
  width:36px;height:36px;
  background:rgba(255,255,255,.15);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
}
.logo-text{color:#fff;font-size:16px;font-weight:600;letter-spacing:.3px}
.logo-sub{color:rgba(255,255,255,.6);font-size:12px;margin-top:1px}

/* ── SEARCH BAR IN HEADER ── */
.header-search{
  display:flex;
  gap:8px;
  flex:1;
  max-width:420px;
}
.header-search input{
  flex:1;
  padding:9px 14px;
  border-radius:var(--radius-sm);
  border:1.5px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:14px;
  outline:none;
  transition:.2s;
}
.header-search input::placeholder{color:rgba(255,255,255,.5)}
.header-search input:focus{
  border-color:rgba(255,255,255,.6);
  background:rgba(255,255,255,.18);
}
.header-search button{
  padding:9px 18px;
  border-radius:var(--radius-sm);
  background:#fff;
  color:var(--blue);
  border:none;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
  white-space:nowrap;
}
.header-search button:hover{background:#e0e7ff}

/* ── MAIN LAYOUT ── */
.page{
  max-width:900px;
  margin:32px auto;
  padding:0 24px 60px;
}

/* ── ASSET INFO CARD ── */
.asset-card{
  background:var(--white);
  border-radius:var(--radius-lg);
  border:1px solid var(--gray-border);
  box-shadow:var(--shadow-md);
  overflow:hidden;
  margin-bottom:24px;
}
.asset-card-header{
  background:linear-gradient(135deg,var(--blue) 0%,#1d4ed8 100%);
  padding:22px 28px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
  flex-wrap:wrap;
}
.asset-name{color:#fff;font-size:20px;font-weight:700}
.asset-serial-tag{
  color:rgba(255,255,255,.75);
  font-size:13px;
  margin-top:5px;
  font-family:monospace;
  letter-spacing:.5px;
}
.status-pill{
  padding:5px 14px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  letter-spacing:.3px;
  white-space:nowrap;
  flex-shrink:0;
}
.status-ok{background:var(--green-bg);color:var(--green);border:1.5px solid var(--green-border)}
.status-repair{background:var(--red-bg);color:var(--red);border:1.5px solid var(--red-border)}
.status-spare{background:var(--amber-bg);color:var(--amber);border:1.5px solid var(--amber-border)}

.asset-meta-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:0;
  border-top:1px solid var(--gray-border);
}
.meta-cell{
  padding:16px 24px;
  border-right:1px solid var(--gray-border);
}
.meta-cell:last-child{border-right:none}
.meta-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;font-weight:600}
.meta-value{font-size:14px;color:var(--text-primary);font-weight:500}

/* ── SECTION HEADER ── */
.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}
.section-title{
  font-size:16px;
  font-weight:700;
  color:var(--text-primary);
  display:flex;
  align-items:center;
  gap:8px;
}
.count-badge{
  background:var(--blue-light);
  color:var(--blue-mid);
  font-size:12px;
  font-weight:600;
  padding:3px 9px;
  border-radius:20px;
  border:1px solid var(--blue-border);
}

/* ── TIMELINE ── */
.timeline{
  position:relative;
  padding-left:44px;
}
.timeline::before{
  content:"";
  position:absolute;
  left:17px;top:24px;bottom:24px;
  width:2px;
  background:linear-gradient(to bottom,var(--blue-mid),var(--blue-border));
  border-radius:2px;
}

.tl-entry{
  position:relative;
  margin-bottom:16px;
}
.tl-entry:last-child{margin-bottom:0}

/* dot */
.tl-dot{
  position:absolute;
  left:-44px;top:18px;
  width:26px;height:26px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;
  z-index:1;
  box-shadow:0 0 0 4px #f1f5f9;
}
.dot-register{background:var(--green-bg);border:2px solid #4ade80;color:var(--green)}
.dot-move{background:var(--blue-light);border:2px solid var(--blue-mid);color:var(--blue-mid)}
.dot-repair{background:var(--red-bg);border:2px solid #f87171;color:var(--red)}
.dot-return{background:var(--amber-bg);border:2px solid #fbbf24;color:var(--amber)}
.dot-current{background:var(--blue-mid);border:2px solid #93c5fd;color:#fff;box-shadow:0 0 0 4px #dbeafe}

/* card */
.tl-card{
  background:var(--white);
  border:1px solid var(--gray-border);
  border-radius:var(--radius-md);
  padding:16px 20px;
  box-shadow:var(--shadow-sm);
  transition:.15s;
}
.tl-card:hover{box-shadow:var(--shadow-md);border-color:#d1d5db}

.tl-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.tl-action{font-size:15px;font-weight:700;color:var(--text-primary)}
.tl-date{
  font-size:12px;
  color:var(--text-muted);
  background:var(--gray-light);
  padding:3px 10px;
  border-radius:20px;
  white-space:nowrap;
  border:1px solid var(--gray-border);
}

.tl-route{
  display:flex;
  align-items:center;
  gap:8px;
  margin:8px 0;
  flex-wrap:wrap;
}
.route-chip{
  padding:4px 12px;
  border-radius:var(--radius-sm);
  font-size:13px;
  font-weight:500;
  background:var(--gray-light);
  border:1px solid var(--gray-border);
  color:var(--text-primary);
}
.route-chip.dest{
  background:var(--blue-light);
  border-color:var(--blue-border);
  color:var(--blue);
}
.route-arrow{color:var(--text-muted);font-size:14px}

.tl-user-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
  flex-wrap:wrap;
}
.user-chip{
  display:flex;align-items:center;gap:5px;
  font-size:12px;color:var(--text-secondary);
}
.user-chip .avatar{
  width:22px;height:22px;
  border-radius:50%;
  background:var(--blue-light);
  color:var(--blue-mid);
  font-size:10px;
  font-weight:700;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--blue-border);
}

.tl-remark{
  margin-top:10px;
  background:var(--gray-light);
  border-left:3px solid var(--blue-mid);
  padding:8px 12px;
  border-radius:0 6px 6px 0;
  font-size:13px;
  color:var(--text-secondary);
}
.remark-label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}

/* ── CURRENT TAG ── */
.current-tag{
  display:inline-block;
  background:var(--blue-mid);
  color:#fff;
  font-size:10px;
  font-weight:700;
  letter-spacing:.5px;
  padding:2px 8px;
  border-radius:20px;
  margin-left:6px;
  vertical-align:middle;
}

/* ── LOADING / EMPTY / ERROR ── */
.state-box{
  background:var(--white);
  border:1px solid var(--gray-border);
  border-radius:var(--radius-lg);
  padding:60px 24px;
  text-align:center;
  box-shadow:var(--shadow-sm);
}
.state-icon{font-size:48px;margin-bottom:12px;opacity:.6}
.state-title{font-size:18px;font-weight:700;color:var(--text-primary);margin-bottom:6px}
.state-sub{font-size:14px;color:var(--text-secondary)}

.spinner{
  width:36px;height:36px;
  border:3px solid var(--blue-border);
  border-top-color:var(--blue-mid);
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── ACTIONS BAR ── */
.actions-bar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:24px;
}
.btn{
  padding:9px 18px;
  border-radius:var(--radius-sm);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  border:1.5px solid transparent;
  transition:.15s;
  display:flex;align-items:center;gap:6px;
  text-decoration:none;
}
.btn-outline{
  background:var(--white);
  border-color:var(--gray-border);
  color:var(--text-primary);
}
.btn-outline:hover{border-color:#9ca3af;background:var(--gray-light)}
.btn-primary{
  background:var(--blue-mid);
  color:#fff;
  border-color:var(--blue-mid);
}
.btn-primary:hover{background:#1d4ed8}
.btn-green{
  background:var(--green-bg);
  color:var(--green);
  border-color:var(--green-border);
}
.btn-green:hover{background:#dcfce7}

/* ── SEARCH HINT ── */
.search-hint{
  background:var(--blue-light);
  border:1px solid var(--blue-border);
  border-radius:var(--radius-md);
  padding:20px 24px;
  text-align:center;
  margin-top:32px;
}
.search-hint p{color:var(--blue);font-size:14px;line-height:1.7}

/* ── ACCESS DENIED ── */
.access-denied{
  background:var(--white);
  border:1px solid var(--red-border);
  border-radius:var(--radius-lg);
  padding:60px 24px;
  text-align:center;
  box-shadow:var(--shadow-sm);
}
.access-denied .icon{font-size:48px;margin-bottom:12px}
.access-denied .title{font-size:18px;font-weight:700;color:var(--text-primary);margin-bottom:6px}
.access-denied .sub{font-size:14px;color:var(--text-secondary)}
.access-denied .btn{
  margin-top:16px;
  display:inline-block;
}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .page{padding:0 16px 40px}
  .asset-card-header{padding:18px 20px}
  .asset-name{font-size:17px}
  .meta-cell{padding:12px 16px}
  .tl-card{padding:14px 16px}
  .timeline{padding-left:38px}
  .tl-dot{left:-38px;width:22px;height:22px;font-size:10px}
  .timeline::before{left:14px}
  .site-header-inner{flex-direction:column;align-items:flex-start}
  .header-search{max-width:100%;width:100%}
}

/* ── PRINT ── */
@media print{
  .site-header,.actions-bar,.header-search button{display:none!important}
  body{background:#fff}
  .page{margin:0;padding:0 16px}
  .tl-card{box-shadow:none!important;border:1px solid #e5e7eb!important}
  .asset-card{box-shadow:none!important}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <div class="logo-wrap">
      <div class="logo-icon">📦</div>
      <div>
        <div class="logo-text">Equipment Management</div>
        <div class="logo-sub">Asset Traceability</div>
      </div>
    </div>
    <div class="header-search">
      <input id="serialInput" type="text" placeholder="ค้นหา Serial Number..." onkeypress="if(event.key==='Enter')search()">
      <button onclick="search()">🔍 ค้นหา</button>
    </div>
  </div>
</header>

<main class="page">
  <div id="root"></div>
</main>

<script>
const root = document.getElementById("root");

function getSerial(){
  return new URLSearchParams(window.location.search).get("serial") || "";
}

// ✅ ฟังก์ชันตรวจสอบแหล่งที่มาของการเข้าถึง
function getSource() {
  const q = new URLSearchParams(window.location.search);
  return q.get("from") || "external";
}

function search(){
  const v = document.getElementById("serialInput").value.trim();
  if(!v){ return; }
  window.location.href = `trace.html?serial=${encodeURIComponent(v)}&from=internal`;
}

function getStatusClass(s=""){
  const t = s.toLowerCase();
  if(t.includes("ซ่อม")) return "status-repair";
  if(t.includes("สำรอง")) return "status-spare";
  return "status-ok";
}

function getDotClass(action=""){
  const a = action.toLowerCase();
  if(a.includes("ลงทะเบียน") || a.includes("เพิ่ม")) return "dot-register";
  if(a.includes("ซ่อม")) return "dot-repair";
  if(a.includes("คืน")) return "dot-return";
  return "dot-move";
}

function getDotIcon(action=""){
  const a = action.toLowerCase();
  if(a.includes("ลงทะเบียน") || a.includes("เพิ่ม")) return "✦";
  if(a.includes("ซ่อม")) return "🔧";
  if(a.includes("คืน")) return "↩";
  return "→";
}

function getInitials(name=""){
  const parts = name.trim().split(" ").filter(Boolean);
  if(!parts.length) return "?";
  return parts.length > 1
    ? (parts[0][0] + parts[parts.length-1][0]).toUpperCase()
    : parts[0].slice(0,2).toUpperCase();
}

async function loadFromURL(){
  const serial = getSerial();
  const source = getSource();  // ✅ ตรวจสอบแหล่งที่มา

  if(serial) document.getElementById("serialInput").value = serial;

  // ✅ ถ้าไม่มี serial หรือมาจากภายนอก → redirect ไป public view
  if(!serial){
    root.innerHTML = `
      <div class="search-hint">
        <div style="font-size:36px;margin-bottom:10px">🔍</div>
        <p><strong>ระบุ Serial Number</strong> ในช่องค้นหาด้านบน<br>เพื่อดูประวัติการเคลื่อนย้ายอุปกรณ์ทั้งหมด</p>
      </div>`;
    return;
  }

  // ✅ ถ้ามาจากภายนอก (ไม่มี ?from=internal) → redirect ไป asset.html (Public View)
  if(source !== "internal"){
    // เปลี่ยนเส้นทางไปที่ asset.html (Public View)
    window.location.href = `/a/${encodeURIComponent(serial)}`;
    return;
  }

  // --- ถ้ามาจาก internal → แสดงประวัติเต็ม ---
  root.innerHTML = `
    <div class="state-box">
      <div class="spinner"></div>
      <div class="state-title">กำลังโหลดข้อมูล...</div>
      <div class="state-sub">${serial}</div>
    </div>`;

  try {
    const res = await fetch(`/api/public-asset-history/${encodeURIComponent(serial)}`);
    const data = await res.json();

    if(!Array.isArray(data) || data.length === 0){
      root.innerHTML = `
        <div class="state-box">
          <div class="state-icon">📭</div>
          <div class="state-title">ไม่พบข้อมูล</div>
          <div class="state-sub">Serial Number <strong>${serial}</strong> ไม่พบในระบบ<br>กรุณาตรวจสอบและลองใหม่อีกครั้ง</div>
        </div>`;
      return;
    }

    /* ── สร้าง asset info จาก entry แรกสุด (ล่าสุด index 0) และล่าสุด ── */
    const latest = data[0];
    const oldest = data[data.length - 1];

    // ── asset card ──
const displaySerial = latest.serialNumber || serial; // ใช้ Serial เต็มจากประวัติ (ถ้ามี)
const assetCardHTML = `
  <div class="asset-card" style="margin-bottom:24px">
    <div class="asset-card-header">
      <div>
        <div class="asset-name">${latest.remark && latest.remark.includes(":") ? latest.remark.split(":").pop().trim() : displaySerial}</div>
        <div class="asset-serial-tag">S/N : ${displaySerial}</div>
      </div>
      <span class="status-pill status-ok">📍 ${latest.to || "ในระบบ"}</span>
    </div>
    <div class="asset-meta-grid">
      <div class="meta-cell">
        <div class="meta-label">รายการทั้งหมด</div>
        <div class="meta-value">${data.length} รายการ</div>
      </div>
      <div class="meta-cell">
        <div class="meta-label">ลงทะเบียนเมื่อ</div>
        <div class="meta-value">${oldest.date || "-"}</div>
      </div>
      <div class="meta-cell">
        <div class="meta-label">อัปเดตล่าสุด</div>
        <div class="meta-value">${latest.date || "-"}</div>
      </div>
      <div class="meta-cell">
        <div class="meta-label">ตำแหน่งล่าสุด</div>
        <div class="meta-value">${latest.to || "-"}</div>
      </div>
    </div>
  </div>`;
    /* ── actions bar ── */
    const actionsHTML = `
      <div class="actions-bar">
        <button class="btn btn-outline" onclick="window.print()">🖨️ พิมพ์รายงาน</button>
        <button class="btn btn-green" onclick="window.history.back()">← ย้อนกลับ</button>
      </div>`;

    /* ── timeline ── */
    let tlHTML = "";
    data.forEach((item, idx) => {
      const isFirst = idx === 0;
      const dotClass = isFirst ? "dot-current" : getDotClass(item.action);
      const dotIcon  = isFirst ? "📍" : getDotIcon(item.action);
      const initials = getInitials(item.user);

      const routeHTML = (item.from && item.from !== "-")
        ? `<div class="tl-route">
            <span class="route-chip">${item.from}</span>
            <span class="route-arrow">→</span>
            <span class="route-chip dest">${item.to || "-"}</span>
           </div>`
        : (item.to && item.to !== "-")
          ? `<div class="tl-route"><span class="route-chip dest">📍 ${item.to}</span></div>`
          : "";

      const remarkHTML = (item.remark && item.remark !== "-")
        ? `<div class="tl-remark">
            <div class="remark-label">หมายเหตุ</div>
            ${item.remark}
           </div>`
        : "";

      tlHTML += `
        <div class="tl-entry">
          <div class="tl-dot ${dotClass}">${dotIcon}</div>
          <div class="tl-card">
            <div class="tl-top">
              <div class="tl-action">
                ${item.action || "-"}
                ${isFirst ? '<span class="current-tag">ล่าสุด</span>' : ""}
              </div>
              <div class="tl-date">📅 ${item.date || "-"}</div>
            </div>
            ${routeHTML}
            <div class="tl-user-row">
              <div class="user-chip">
                <div class="avatar">${initials}</div>
                <span>${item.user || "System"}</span>
              </div>
            </div>
            ${remarkHTML}
          </div>
        </div>`;
    });

    /* ── section header ── */
    const sectionHTML = `
      <div class="section-head">
        <div class="section-title">
          📋 ประวัติการเคลื่อนย้าย
          <span class="count-badge">${data.length} รายการ</span>
        </div>
      </div>
      <div class="timeline">${tlHTML}</div>`;

    root.innerHTML = assetCardHTML + actionsHTML + sectionHTML;

  } catch(err) {
    console.error(err);
    root.innerHTML = `
      <div class="state-box">
        <div class="state-icon">⚠️</div>
        <div class="state-title">เกิดข้อผิดพลาด</div>
        <div class="state-sub">ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่</div>
      </div>`;
  }
}

window.onload = loadFromURL;
</script>
</body>
</html>
