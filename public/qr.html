<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code — Asset Traceability</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

/* =========================
   PRINT FIX
========================= */
@media print {

  body {
    background: white !important;
  }

  .card-header,
  .btn-row,
  .footer {
    display: none !important;
  }

  .card {
    box-shadow: none !important;
    border: none !important;
  }

  #printArea {
    background: white !important;
  }

  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
}

/* =========================
   NORMAL STYLE
========================= */
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:"Segoe UI",sans-serif;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  padding:24px;
}

.card{
  background:#fff;
  width:100%;
  max-width:650px;
  border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,.1);
  overflow:hidden;
}

.card-header{
  background:linear-gradient(135deg,#1e3a8a,#1d4ed8);
  color:#fff;
  text-align:center;
  padding:20px;
}

.card-body{padding:24px}

/* =========================
   EXPORT AREA (สำคัญ)
========================= */
#printArea{
  background:#fff;
  padding:10px;
}

/* layout */
.main{
  display:flex;
  gap:20px;
}

.qr-section{
  flex:0 0 220px;
}

.qr-wrap{
  width:220px;
  height:220px;
  border:2px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
}

.qr-wrap img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.info-section{flex:1}

.serial-box{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

.serial-value{
  font-family:monospace;
  font-weight:700;
  color:#1e3a8a;
}

.info-row{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px dashed #e5e7eb;
}

/* buttons */
.btn-row{
  margin-top:20px;
  display:flex;
  gap:10px;
}

.btn{
  padding:10px 14px;
  border-radius:10px;
  border:0;
  cursor:pointer;
}

.btn-primary{background:#2563eb;color:#fff}
.btn-outline{background:#fff;border:1px solid #ddd}
.btn-teal{background:#0d9488;color:#fff}

.footer{
  text-align:center;
  font-size:12px;
  color:#6b7280;
  padding:12px;
}

.error{
  background:#fee2e2;
  padding:10px;
  border-radius:8px;
  color:#991b1b;
  margin-bottom:10px;
}

</style>
</head>

<body>

<div class="card">

  <div class="card-header">
    QR Code Asset
  </div>

  <div class="card-body">

    <div id="errorBox" class="error" style="display:none">
      ไม่พบ Serial Number
    </div>

    <!-- 🔥 THIS IS THE IMPORTANT PART -->
    <div id="printArea">

      <div class="main">

        <div class="qr-section">
          <div class="qr-wrap" id="qrWrap">Loading...</div>
        </div>

        <div class="info-section">

          <div class="serial-box">
            Serial:
            <div class="serial-value" id="serialValue">-</div>
          </div>

          <div class="info-row">
            <span>Part Number</span>
            <span id="partNumber">-</span>
          </div>

          <div class="info-row">
            <span>Name</span>
            <span id="assetName">-</span>
          </div>

        </div>

      </div>

    </div>

    <!-- buttons (NOT EXPORT) -->
    <div class="btn-row" id="btnRow" style="display:none">
      <button class="btn btn-primary" onclick="downloadQR()">Download</button>
      <button class="btn btn-outline" onclick="window.print()">Print</button>
      <a class="btn btn-teal" id="traceLink">History</a>
    </div>

  </div>

  <div class="footer" id="footerText">Loading...</div>

</div>

<script>

let currentSerial = "";

async function loadQR(){

  const serial = new URLSearchParams(window.location.search).get("serial");
  currentSerial = serial;

  if(!serial){
    document.getElementById("errorBox").style.display="block";
    return;
  }

  document.getElementById("serialValue").textContent = serial;
  document.getElementById("traceLink").href = `/trace.html?serial=${serial}`;

  const res = await fetch(`/api/qrcode/${serial}`);
  const data = await res.json();

  const img = document.createElement("img");
  img.src = data.qrImage;

  const qrWrap = document.getElementById("qrWrap");
  qrWrap.innerHTML = "";
  qrWrap.appendChild(img);

  const assetRes = await fetch("/api/assets");
  const assets = await assetRes.json();
  const asset = assets.find(a => a.serialNumber === serial);

  document.getElementById("partNumber").textContent = asset?.partNumber || "-";
  document.getElementById("assetName").textContent = asset?.name || "-";

  document.getElementById("btnRow").style.display = "flex";
  document.getElementById("footerText").textContent = "Ready";
}

/* =========================
   FIXED DOWNLOAD
========================= */
async function downloadQR(){

  const el = document.getElementById("printArea");

  const canvas = await html2canvas(el, {
    backgroundColor: "#ffffff",
    scale: 2,
    useCORS: true
  });

  const link = document.createElement("a");
  link.href = canvas.toDataURL("image/png");
  link.download = `QR-${currentSerial}.png`;
  link.click();
}

loadQR();

</script>

</body>
</html>
