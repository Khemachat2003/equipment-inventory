<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
/* ── Font ── */
@font-face {
  font-family: 'THSarabunNew';
  src: url('/fonts/THSarabunNew.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: 'Segoe UI', system-ui, sans-serif; 
  background: #f1f5f9; 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  padding: 24px; 
  min-height: 100vh;
}
h1 { 
  margin-bottom: 20px; 
  color: #0f172a; 
  font-weight: 700;
  font-size: 24px;
  font-family: 'Segoe UI', system-ui, sans-serif;
}
.container { 
  background: #fff; 
  border-radius: 16px; 
  padding: 28px; 
  box-shadow: 0 4px 20px rgba(0,0,0,.08); 
  max-width: 760px; 
  width: 100%; 
}

/* ── Controls ── */
.controls { 
  display: flex; 
  gap: 16px; 
  flex-wrap: wrap; 
  margin-bottom: 20px; 
  align-items: flex-end; 
}
.controls .group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.controls label { 
  font-weight: 600; 
  color: #475569; 
  font-size: 12px; 
  text-transform: uppercase;
  letter-spacing: .4px;
}
.controls input[type="number"],
.controls select { 
  padding: 8px 10px; 
  border: 1.5px solid #d1d5db; 
  border-radius: 8px; 
  font-size: 14px;
  font-weight: 600;
  outline: none;
  transition: .2s;
  background: #fff;
}
.controls input[type="number"] { width: 76px; }
.controls select { width: 120px; cursor: pointer; }
.controls input[type="number"]:focus,
.controls select:focus {
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37,99,235,.12);
}
.controls .unit {
  font-size: 13px;
  color: #94a3b8;
  margin-left: 2px;
}
.controls .size-row {
  display: flex;
  align-items: center;
  gap: 4px;
}
.controls .save-btn {
  background: #0d9488;
  color: #fff;
  border: none;
  padding: 8px 18px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: .2s;
  margin-left: auto;
}
.controls .save-btn:hover { background: #0f766e; }

/* ── Error ── */
.error { 
  color: #dc2626; 
  margin-bottom: 12px; 
  font-size: 14px;
  font-weight: 500;
}

/* ── Preview Area ── */
.preview-area { 
  border: 2px solid #e5e7eb; 
  border-radius: 12px; 
  padding: 20px; 
  background: #fafbfc; 
  display: flex; 
  justify-content: center; 
}

#qrDisplay { 
  display: flex; 
  align-items: center; 
  gap: 24px; 
  border: 1.5px solid #d1d5db; 
  border-radius: 10px; 
  background: #ffffff; 
  max-width: 100%; 
  transition: all 0.2s; 
  min-width: 280px;
  font-family: 'THSarabunNew', 'Segoe UI', system-ui, sans-serif;
}
#qrDisplay .qr-image { 
  flex-shrink: 0; 
}
#qrDisplay .qr-image img { 
  display: block; 
  background: #fff; 
  border: 1px solid #f1f5f9;
  border-radius: 4px;
}

/* ── Info (ขวา) ── */
#qrDisplay .info { 
  font-size: 14px; 
  color: #0f172a; 
  line-height: 1.7; 
  min-width: 120px;
  flex: 1;
}
#qrDisplay .info .label { 
  font-weight: 500; 
  color: #64748b; 
  font-size: 0.9em;
}
#qrDisplay .info .serial-value {
  font-weight: 800;          /* หนาขึ้น */
  color: #0f172a;
  letter-spacing: 0.2px;
  font-family: 'Courier New', monospace;
  word-break: break-all;
}
#qrDisplay .info .part-value {
  font-weight: 700;          /* หนาขึ้น */
  color: #1e293b;
}
#qrDisplay .info .name-value {
  font-weight: 700;          /* หนาขึ้น */
  color: #1e293b;
}
#qrDisplay .info .row {
  display: flex;
  align-items: baseline;
  gap: 6px;
  flex-wrap: wrap;
  padding: 2px 0;
}

/* ── Dark mode (background ดำ) ── */
#qrDisplay.dark {
  background: #1a1a1a;
  border-color: #ffffff;
}
#qrDisplay.dark .info .label { color: #9ca3af; }
#qrDisplay.dark .info .serial-value { color: #ffffff; }
#qrDisplay.dark .info .part-value { color: #f3f4f6; }
#qrDisplay.dark .info .name-value { color: #f3f4f6; }
#qrDisplay.dark .qr-image img { border-color: #374151; }

/* ── Buttons ── */
.btn-row { 
  display: flex; 
  gap: 12px; 
  margin-top: 20px; 
  flex-wrap: wrap; 
}
.btn { 
  padding: 10px 24px; 
  border: none; 
  border-radius: 8px; 
  font-weight: 600; 
  cursor: pointer; 
  transition: .2s; 
  font-size: 14px;
}
.btn-primary { background: #2563eb; color: #fff; }
.btn-primary:hover { background: #1d4ed8; }
.btn-outline { background: #fff; border: 1.5px solid #d1d5db; color: #0f172a; }
.btn-outline:hover { background: #f1f5f9; }
.btn-teal { background: #0d9488; color: #fff; }
.btn-teal:hover { background: #0f766e; }

/* ── Responsive ── */
@media (max-width: 550px) {
  #qrDisplay {
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 16px;
    min-width: unset;
  }
  #qrDisplay .info .row {
    justify-content: center;
  }
  .controls {
    gap: 10px;
  }
  .controls .save-btn {
    margin-left: 0;
    width: 100%;
  }
}

/* ── Print ── */
@media print {
  h1, .controls, .btn-row { display: none !important; }
  .preview-area { border: none; padding: 0; background: #fff; }
  #qrDisplay { border: 1px solid #000; }
  body { padding: 0; background: #fff; }
  .container { box-shadow: none; padding: 0; }
}
</style>
</head>
<body>

<h1>🔖 QR Code Generator</h1>

<div class="container">
  <!-- Controls -->
  <div class="controls">
    <div class="group">
      <label>📐 กว้าง</label>
      <div class="size-row">
        <input type="number" id="widthInput" min="60" max="500" oninput="onSizeChange()">
        <span class="unit">px</span>
      </div>
    </div>
    <div class="group">
      <label>📐 สูง</label>
      <div class="size-row">
        <input type="number" id="heightInput" min="60" max="500" oninput="onSizeChange()">
        <span class="unit">px</span>
      </div>
    </div>
    <div class="group">
      <label>🟦 ขอบกรอบ</label>
      <div class="size-row">
        <input type="number" id="paddingInput" min="0" max="80" oninput="onSizeChange()">
        <span class="unit">px</span>
      </div>
    </div>
    <div class="group">
      <label>🔤 Serial size</label>
      <div class="size-row">
        <input type="number" id="serialSizeInput" min="10" max="50" oninput="onSizeChange()">
        <span class="unit">px</span>
      </div>
    </div>
    <div class="group">
      <label>🔤 Part/Name size</label>
      <div class="size-row">
        <input type="number" id="otherSizeInput" min="10" max="50" oninput="onSizeChange()">
        <span class="unit">px</span>
      </div>
    </div>
    <div class="group">
      <label>🎨 พื้นหลัง</label>
      <select id="bgColorSelect" onchange="onSizeChange()">
        <option value="light">ขาว</option>
        <option value="dark">ดำ</option>
      </select>
    </div>
    <button class="save-btn" onclick="saveTemplate()">💾 เซฟเป็น Template</button>
  </div>

  <!-- Error -->
  <div id="errorMsg" class="error"></div>

  <!-- Preview -->
  <div class="preview-area">
    <div id="qrDisplay">
      <div class="qr-image">
        <img id="qrImg" src="" alt="QR" style="display:block;background:#fff;">
      </div>
      <div class="info">
        <div class="row">
          <span class="label">Serial:</span>
          <span class="serial-value" id="dispSerial">-</span>
        </div>
        <div class="row">
          <span class="label">Part:</span>
          <span class="part-value" id="dispPart">-</span>
        </div>
        <div class="row">
          <span class="label">ชื่ออุปกรณ์:</span>
          <span class="name-value" id="dispName">-</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn btn-primary" onclick="downloadQR()">⬇️ ดาวน์โหลด PNG</button>
    <button class="btn btn-outline" onclick="window.print()">🖨️ พิมพ์</button>
    <a class="btn btn-teal" id="traceLink" href="#">📋 ประวัติ</a>
  </div>
</div>

<script>
let currentSerial = '';
let assetInfo = {};
const STORAGE_KEY = 'qrTemplate';

// ── โหลด template จาก localStorage ──
function loadTemplate() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const t = JSON.parse(saved);
      document.getElementById('widthInput').value = t.width || 180;
      document.getElementById('heightInput').value = t.height || 180;
      document.getElementById('paddingInput').value = t.padding || 18;
      document.getElementById('serialSizeInput').value = t.serialSize || 20;
      document.getElementById('otherSizeInput').value = t.otherSize || 16;
      document.getElementById('bgColorSelect').value = t.bgColor || 'light';
    } else {
      // default
      document.getElementById('widthInput').value = 180;
      document.getElementById('heightInput').value = 180;
      document.getElementById('paddingInput').value = 18;
      document.getElementById('serialSizeInput').value = 20;
      document.getElementById('otherSizeInput').value = 16;
      document.getElementById('bgColorSelect').value = 'light';
    }
  } catch {
    // fallback
    document.getElementById('widthInput').value = 180;
    document.getElementById('heightInput').value = 180;
    document.getElementById('paddingInput').value = 18;
    document.getElementById('serialSizeInput').value = 20;
    document.getElementById('otherSizeInput').value = 16;
    document.getElementById('bgColorSelect').value = 'light';
  }
}

// ── บันทึก template ──
function saveTemplate() {
  const w = parseInt(document.getElementById('widthInput').value) || 180;
  const h = parseInt(document.getElementById('heightInput').value) || 180;
  const p = parseInt(document.getElementById('paddingInput').value) || 18;
  const s = parseInt(document.getElementById('serialSizeInput').value) || 20;
  const o = parseInt(document.getElementById('otherSizeInput').value) || 16;
  const bg = document.getElementById('bgColorSelect').value;
  const template = { width: w, height: h, padding: p, serialSize: s, otherSize: o, bgColor: bg };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(template));
  alert('✅ เซฟ Template เรียบร้อย');
}

// ── เรียกเมื่อค่ามีการเปลี่ยนแปลง ──
function onSizeChange() {
  updatePreview();
}

// ── ดึงค่า ──
function getSize() {
  const w = parseInt(document.getElementById('widthInput').value) || 180;
  const h = parseInt(document.getElementById('heightInput').value) || 180;
  const p = parseInt(document.getElementById('paddingInput').value) || 18;
  const s = parseInt(document.getElementById('serialSizeInput').value) || 20;
  const o = parseInt(document.getElementById('otherSizeInput').value) || 16;
  const bg = document.getElementById('bgColorSelect').value;
  return { w, h, p, s, o, bg };
}

// ── อัปเดต Preview ──
function updatePreview() {
  const { w, h, p, s, o, bg } = getSize();
  const img = document.getElementById('qrImg');
  img.style.width = w + 'px';
  img.style.height = h + 'px';

  // ปรับ padding ของกรอบ
  const display = document.getElementById('qrDisplay');
  display.style.padding = p + 'px';

  // ปรับขนาดตัวหนังสือ
  document.querySelector('.serial-value').style.fontSize = s + 'px';
  document.querySelector('.part-value').style.fontSize = o + 'px';
  document.querySelector('.name-value').style.fontSize = o + 'px';

  // ปรับสีพื้นหลังและเส้นขอบ
  if (bg === 'dark') {
    display.classList.add('dark');
    display.style.borderColor = '#ffffff';
    // ปรับสีเส้นขอบของรูป QR ให้เป็นขาว
    const qrBorder = document.querySelector('.qr-image img');
    if (qrBorder) qrBorder.style.borderColor = '#ffffff';
  } else {
    display.classList.remove('dark');
    display.style.borderColor = '#d1d5db';
    const qrBorder = document.querySelector('.qr-image img');
    if (qrBorder) qrBorder.style.borderColor = '#f1f5f9';
  }
}

// ── โหลด QR ──
async function loadQR() {
  const serial = new URLSearchParams(window.location.search).get('serial') || '';
  currentSerial = serial;
  if (!serial) {
    document.getElementById('errorMsg').textContent = '⚠️ ไม่พบ Serial Number';
    return;
  }
  document.getElementById('dispSerial').textContent = serial;
  document.getElementById('traceLink').href = `/trace.html?serial=${encodeURIComponent(serial)}`;

  try {
    const res = await fetch(`/api/qrcode/${encodeURIComponent(serial)}`);
    if (!res.ok) {
      if (res.status === 401) {
        // fallback public
        const pub = await fetch(`/api/public/asset/${encodeURIComponent(serial)}`);
        const d = await pub.json();
        if (d.qr) {
          document.getElementById('qrImg').src = d.qr;
          document.getElementById('dispPart').textContent = d.partNumber || '-';
          document.getElementById('dispName').textContent = d.name || '-';
          assetInfo = d;
          updatePreview();
        }
        return;
      }
      throw new Error('not ok');
    }
    const data = await res.json();
    if (data.qrImage) {
      document.getElementById('qrImg').src = data.qrImage;
    }
    const a = data.asset || {};
    document.getElementById('dispPart').textContent = a.partNumber || '-';
    document.getElementById('dispName').textContent = a.name || '-';
    assetInfo = a;
    updatePreview();
  } catch (e) {
    document.getElementById('errorMsg').textContent = '⚠️ โหลดข้อมูลไม่สำเร็จ';
    console.error(e);
  }
}

// ── ดาวน์โหลด PNG ──
async function downloadQR() {
  const el = document.getElementById('qrDisplay');
  try {
    const canvas = await html2canvas(el, {
      backgroundColor: '#ffffff',
      scale: 2,
      useCORS: true
    });
    const link = document.createElement('a');
    link.href = canvas.toDataURL('image/png');
    link.download = `QR-${currentSerial}.png`;
    link.click();
  } catch (e) {
    alert('ไม่สามารถดาวน์โหลดได้');
  }
}

// ── เริ่มต้น ──
window.onload = function() {
  loadTemplate();
  loadQR();
};
</script>
</body>
</html>
