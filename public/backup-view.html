<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">analytics</span> ข้อมูล Backup - PostgreSQL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f1f5f9;color:#0f172a;font-size:14px;padding:20px}
.header{background:#0f172a;padding:16px 24px;border-radius:12px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.header h1{color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
.header a{color:rgba(255,255,255,.6);text-decoration:none;padding:8px 16px;border:1px solid rgba(255,255,255,.1);border-radius:8px;transition:.2s}
.header a:hover{background:rgba(255,255,255,.1);color:#fff}

.filter-bar{background:#fff;padding:16px 20px;border-radius:12px;margin-bottom:16px;border:1px solid #e2e8f0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filter-bar select{padding:8px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none;background:#fff;min-width:200px}
.filter-bar select:focus{border-color:#2563eb}
.btn{padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;border:none;transition:.15s;font-size:13px}
.btn-primary{background:#2563eb;color:#fff}
.btn-primary:hover{background:#1d4ed8}
.btn-outline{background:#f1f5f9;color:#475569;border:1.5px solid #e2e8f0}
.btn-outline:hover{background:#e2e8f0}
.btn-success{background:#16a34a;color:#fff}
.btn-success:hover{background:#15803d}

.table-wrap{background:#fff;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden}
.table-scroll{overflow-x:auto;max-height:600px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{position:sticky;top:0;z-index:10}
thead th{background:#f8fafc;padding:12px 16px;text-align:left;font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #e2e8f0;white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tbody tr:hover{background:#fafcff}
.loading{text-align:center;padding:40px;color:#94a3b8}
.loading .spin{width:28px;height:28px;border:3px solid #bfdbfe;border-top-color:#2563eb;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:60px 20px;color:#94a3b8}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.stats{margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap}
.stats .badge{background:#f1f5f9;padding:6px 14px;border-radius:20px;font-size:12px;color:#475569}
.stats .badge strong{color:#0f172a}

/* ═══════════════════════════════════════════════════════════════
   ICON DESIGN SYSTEM — Premium Material Symbols
   Size × Weight × Fill × Grade × Color × State
═══════════════════════════════════════════════════════════════ */

/* Base icon element */
.material-symbols-rounded {
  font-family: 'Material Symbols Rounded';
  font-style: normal;
  font-variation-settings:
    'wght' var(--icon-w-regular, 400),
    'FILL' var(--icon-fill-none, 0),
    'GRAD' var(--icon-grade-normal, 0),
    'opsz' var(--icon-opsz-md, 24);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  line-height: 1;
  vertical-align: middle;
  transition:
    font-variation-settings var(--icon-transition),
    color var(--icon-transition),
    transform var(--icon-transition);
}

/* ─── Size Modifiers ─── */
.icon-xs { font-size: var(--icon-xs); --icon-opsz-md: var(--icon-opsz-sm); }
.icon-sm { font-size: var(--icon-sm); --icon-opsz-md: var(--icon-opsz-sm); }
.icon-md { font-size: var(--icon-md); --icon-opsz-md: var(--icon-opsz-md); }
.icon-lg { font-size: var(--icon-lg); --icon-opsz-md: var(--icon-opsz-lg); }
.icon-xl { font-size: var(--icon-xl); --icon-opsz-md: var(--icon-opsz-lg); }
.icon-2xl { font-size: var(--icon-2xl); --icon-opsz-md: var(--icon-opsz-xl); }

/* ─── Weight Modifiers ─── */
.icon-light     { --icon-w-regular: var(--icon-w-light); }
.icon-regular   { --icon-w-regular: var(--icon-w-regular); }
.icon-medium    { --icon-w-regular: var(--icon-w-medium); }
.icon-semibold  { --icon-w-regular: var(--icon-w-semibold); }
.icon-bold      { --icon-w-regular: var(--icon-w-bold); }

/* ─── Fill Modifiers (semantic) ─── */
.icon-outline   { --icon-fill-none: var(--icon-fill-none); }
.icon-hover     { --icon-fill-none: var(--icon-fill-subtle); }
.icon-active    { --icon-fill-none: var(--icon-fill-half); }
.icon-filled    { --icon-fill-none: var(--icon-fill-full); }

/* ─── Grade Modifiers ─── */
.icon-grade-normal { --icon-grade-normal: var(--icon-grade-normal); }
.icon-grade-dark   { --icon-grade-normal: var(--icon-grade-dark); }
.icon-grade-light  { --icon-grade-normal: var(--icon-grade-light); }

/* ─── Semantic Color Variants ─── */
.icon-primary   { color: var(--blue); }
.icon-secondary { color: var(--tsub); }
.icon-muted     { color: var(--tmuted); }
.icon-success   { color: var(--emerald); }
.icon-warning   { color: var(--amber); }
.icon-danger    { color: var(--red); }
.icon-purple    { color: var(--purple); }
.icon-white     { color: #fff; }
.icon-inherit   { color: inherit; }

/* ─── Composite Utility Classes ─── */
.nav-icon {
  --icon-w-regular: var(--icon-w-medium);
  --icon-fill-none: var(--icon-fill-none);
  --icon-grade-normal: var(--icon-grade-normal);
  --icon-opsz-md: var(--icon-opsz-md);
  font-size: var(--icon-md);
  color: var(--tsub);
  transition: color var(--icon-transition), font-variation-settings var(--icon-transition);
}
.nav-icon:hover,
.nav-icon.active {
  color: var(--blue);
  --icon-fill-none: var(--icon-fill-full);
  --icon-w-regular: var(--icon-w-semibold);
}

.btn-icon {
  --icon-w-regular: var(--icon-w-semibold);
  --icon-fill-none: var(--icon-fill-none);
  font-size: var(--icon-sm);
}
.btn-primary .btn-icon    { color: var(--blue); }
.btn-primary:hover .btn-icon    { --icon-fill-none: var(--icon-fill-subtle); }
.btn-primary:active .btn-icon   { --icon-fill-none: var(--icon-fill-half); }
.btn-secondary .btn-icon  { color: var(--tsub); }
.btn-outline .btn-icon    { color: var(--blue); }
.btn-ghost .btn-icon      { color: var(--tsub); }
.btn-ghost:hover .btn-icon    { color: var(--blue); --icon-fill-none: var(--icon-fill-subtle); }

.status-icon {
  --icon-w-regular: var(--icon-w-semibold);
  --icon-fill-none: var(--icon-fill-full);
  font-size: var(--icon-xs);
}
.status-success .status-icon { color: var(--emerald); }
.status-warning .status-icon { color: var(--amber); }
.status-danger .status-icon  { color: var(--red); }
.status-info .status-icon    { color: var(--blue); }

.card-icon {
  --icon-w-regular: var(--icon-w-regular);
  --icon-fill-none: var(--icon-fill-none);
  font-size: var(--icon-xl);
  color: var(--blue);
}
.card:hover .card-icon {
  --icon-fill-none: var(--icon-fill-subtle);
  --icon-w-regular: var(--icon-w-medium);
}

.fab-icon {
  --icon-w-regular: var(--icon-w-bold);
  --icon-fill-none: var(--icon-fill-full);
  font-size: var(--icon-lg);
  color: #fff;
}

.table-action-icon {
  --icon-w-regular: var(--icon-w-medium);
  --icon-fill-none: var(--icon-fill-none);
  font-size: var(--icon-sm);
  color: var(--tmuted);
  transition: color var(--icon-transition), font-variation-settings var(--icon-transition), transform var(--icon-transition);
}
.table-action-icon:hover {
  color: var(--blue);
  --icon-fill-none: var(--icon-fill-subtle);
  transform: scale(1.1);
}

.empty-icon {
  --icon-w-regular: var(--icon-w-light);
  --icon-fill-none: var(--icon-fill-none);
  font-size: var(--icon-2xl);
  color: var(--g300);
}

.header-icon {
  --icon-w-regular: var(--icon-w-semibold);
  --icon-fill-none: var(--icon-fill-full);
  font-size: var(--icon-lg);
  color: var(--ink);
}

.material-symbols-rounded:not(.no-transition) {
  transition: font-variation-settings 150ms ease, color 150ms ease, transform 150ms ease;
}

.material-symbols-rounded:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
  border-radius: 4px;
}

@media (prefers-reduced-motion: reduce) {
  .material-symbols-rounded {
    transition: none;
  }
}


/* ── Global: ลบเส้นใต้ anchor ทุกแบบ (รวม icon-button ที่ JS สร้างขึ้น) ── */
a,
a:link,
a:visited { text-decoration: none; }
a:hover,
a:focus { text-decoration: none; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-25..200" crossorigin="anonymous" />
</head>
<body>

<div class="header">
  <h1><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">analytics</span> ข้อมูล Backup (PostgreSQL)</h1>
  <div>
    <!-- <span class="material-symbols-rounded icon-sm icon-regular icon-filled icon-success">check_circle</span> กลับ Dashboard แบบง่าย -->
    <a href="/dashboard">← กลับ Dashboard</a>
    <button class="btn btn-success" onclick="exportCurrentTable()" style="margin-left:8px;"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">download</span> Export CSV</button>
  </div>
</div>

<div class="filter-bar">
  <select id="tableSelect" onchange="loadTableData()">
    <option value="">-- เลือกตาราง --</option>
    <option value="backup_stock_master"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">inventory_2</span> Stock Master</option>
    <option value="backup_stock_office"><span class="material-symbols-rounded icon-md icon-regular icon-outline">building</span> Stock Office</option>
    <option value="backup_stock_site"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">factory</span> Stock Site</option>
    <option value="backup_transfer_log"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">assignment</span> Transfer Log</option>
    <option value="backup_asset_list"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">archive</span> Asset List</option>
    <option value="backup_asset_history"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">description</span> Asset History</option>
    <option value="backup_damaged_assets">⚠ อุปกรณ์ชำรุด/สูญหาย</option>
    <option value="backup_part_catalog"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">build</span> Part Catalog</option>
    <option value="backup_farm_sites"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">eco</span> Farm Sites</option>
    <option value="backup_farm_houses"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">home</span> Farm Houses</option>
    <option value="backup_users"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">person</span> Users</option>
    <option value="backup_audit_log"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">assignment</span> Audit Log</option>
  </select>
  <button class="btn btn-primary" onclick="loadTableData()"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary icon-secondary">search</span> โหลด</button>
  <button class="btn btn-outline" onclick="refreshAll()"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">refresh</span> Refresh All</button>
</div>

<div id="stats" class="stats"></div>

<div class="table-wrap">
  <div class="table-scroll" id="tableScroll">
    <div id="tableContainer">
      <div class="loading"><div class="spin"></div>เลือกตารางเพื่อดูข้อมูล</div>
    </div>
  </div>
</div>

<script>
let currentTable = '';
let currentData = [];

async function loadTableData() {
  const table = document.getElementById('tableSelect').value;
  if (!table) {
    document.getElementById('tableContainer').innerHTML = '<div class="loading"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">assignment</span> เลือกตารางเพื่อดูข้อมูล</div>';
    document.getElementById('stats').innerHTML = '';
    return;
  }

  currentTable = table;
  document.getElementById('tableContainer').innerHTML = '<div class="loading"><div class="spin"></div>กำลังโหลด...</div>';

  try {
    const res = await fetch(`/api/backup-data?table=${encodeURIComponent(table)}`);

    if (res.status === 401 || res.status === 403) {
      document.getElementById('tableContainer').innerHTML = `
        <div class="empty-state">
          <div class="icon"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">lock</span></div>
          <div>ต้องเข้าสู่ระบบในฐานะ Admin ก่อนดูข้อมูล Backup</div>
          <div style="margin-top:14px"><a href="/" class="btn btn-primary">← กลับเข้าสู่ระบบ</a></div>
        </div>
      `;
      document.getElementById('stats').innerHTML = '';
      return;
    }

    const data = await res.json();

    if (!data.success || !data.rows || !data.rows.length) {
      document.getElementById('tableContainer').innerHTML = `
        <div class="empty-state">
          <div class="icon"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">mail</span></div>
          <div>ไม่มีข้อมูลในตารางนี้ — ยังไม่เคยกด Backup ทั้งระบบ หรือตารางว่าง</div>
        </div>
      `;
      document.getElementById('stats').innerHTML = '';
      return;
    }

    currentData = data.rows;

    // สร้างแถวสรุป
    document.getElementById('stats').innerHTML = `
      <span class="badge"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">analytics</span> <strong>${data.rows.length}</strong> แถว</span>
      <span class="badge"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">schedule</span> อัปเดตล่าสุด: <strong>${data.rows[0]?.backup_date || '-'}</strong></span>
    `;

    // สร้างตาราง
    const columns = Object.keys(data.rows[0]);
    let html = '<table><thead><tr>';
    columns.forEach(col => {
      html += `<th>${col}</th>`;
    });
    html += '</tr></thead><tbody>';

    data.rows.forEach(row => {
      html += '<tr>';
      columns.forEach(col => {
        const val = row[col] || '-';
        html += `<td>${val}</td>`;
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    document.getElementById('tableContainer').innerHTML = html;

  } catch (err) {
    document.getElementById('tableContainer').innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠</div>
        <div>เกิดข้อผิดพลาด: ${err.message}</div>
      </div>
    `;
  }
}

// <span class="material-symbols-rounded icon-sm icon-regular icon-filled icon-success">check_circle</span> ตรวจว่าเข้าสู่ระบบเป็น Admin แล้วก่อนโหลด
async function checkAuth() {
  try {
    const res = await fetch('/api/check-auth');
    const d = await res.json();
    if (!d.loggedIn || d.role !== 'admin') {
      document.getElementById('tableContainer').innerHTML = `
        <div class="empty-state">
          <div class="icon"><span class="material-symbols-rounded icon-md icon-regular icon-outline icon-primary">lock</span></div>
          <div>ต้องเข้าสู่ระบบในฐานะ Admin ก่อนดูข้อมูล Backup</div>
          <div style="margin-top:14px"><a href="/" class="btn btn-primary">← กลับเข้าสู่ระบบ</a></div>
        </div>
      `;
      return false;
    }
    return true;
  } catch (e) {
    return false;
  }
}

// <span class="material-symbols-rounded icon-sm icon-regular icon-filled icon-success">check_circle</span> โหลดตารางแรกอัตโนมัติ
document.addEventListener('DOMContentLoaded', async function() {
  const select = document.getElementById('tableSelect');
  if (!select) return;
  const ok = await checkAuth();
  if (!ok) return;
  select.value = 'backup_stock_master';
  loadTableData();
});

function exportCurrentTable() {
  if (!currentData || !currentData.length) {
    alert('⚠ ไม่มีข้อมูลที่จะ Export');
    return;
  }

  const columns = Object.keys(currentData[0]);
  let csv = columns.join(',') + '\n';
  currentData.forEach(row => {
    const values = columns.map(col => {
      const val = row[col] || '';
      return `"${String(val).replace(/"/g, '""')}"`;
    });
    csv += values.join(',') + '\n';
  });

  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `${currentTable}_${new Date().toISOString().slice(0,10)}.csv`;
  link.click();
}

function refreshAll() {
  loadTableData();
}

// กด Enter เพื่อโหลด
document.getElementById('tableSelect').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loadTableData();
});
</script>
